function CrewPicker({ ch, cfg, update }) {
  const list = ch.besoins || [];
  const get = id => { const b = list.find(x => x.role === id); return b ? Math.round(num(b.nb)) : 0; };
  const set = (id, nb) => update(cur => {
    const prev = cur.besoins || [];
    const next = ROLES.map(r => ({ role: r.id, nb: r.id === id ? Math.max(0, nb) : Math.round(num((prev.find(x => x.role === r.id) || {}).nb)) })).filter(b => b.nb > 0);
    return { besoins: next };
  });
  const total = ROLES.reduce((s, r) => s + get(r.id), 0);
  return html`<div className="crew" id="crew" tabIndex="-1">
    ${ROLES.map(r => html`<div className="crew-row" key=${r.id}>
      <span className="crew-l"><strong>${r.label}</strong><small>${fmtQ(num(cfg.tauxPostes[r.id]))} €/h HT</small></span>
      <span className="stepper">
        <button type="button" aria-label=${'Un ' + r.label.toLowerCase() + ' de moins'} onClick=${() => set(r.id, get(r.id) - 1)} disabled=${get(r.id) <= 0}>−</button>
        <output aria-live="polite">${get(r.id)}</output>
        <button type="button" aria-label=${'Un ' + r.label.toLowerCase() + ' de plus'} onClick=${() => set(r.id, get(r.id) + 1)}>+</button>
      </span>
    </div>`)}
    ${!total ? html`<span className="hint">Aucune équipe choisie : le devis compte 1 personne au taux par défaut.</span>` : null}
  </div>`;
}

function InfosSec({ ch, cfg, comp, update, caps, notify, canStore, onShowDevis }) {
  const [busy, setBusy] = useState(0);
  const [over, setOver] = useState(false);
  const [run, setRun] = useState({ state: 'idle' });
  const [undo, setUndo] = useState(null);
  const [armed, setArmed] = useState(null);
  const ctl = useRef(null);
  const runningRef = useRef(false);
  const chRef = useRef(ch); chRef.current = ch;
  const files = ch.fichiers || [];
  const canUpload = !!canStore;

  async function addFiles(list) {
    let snap = null;
    for (const f of list) {
      setBusy(b => b + 1);
      try {
        const blob = await prepareImage(f);
        const entry = await storeFile(blob, blob.name || f.name || 'photo.jpg');
        update(cur => { const fichiers = [...(cur.fichiers || []), entry]; snap = Object.assign({}, cur, { fichiers }); return { fichiers }; });
      } catch (e) { notify(uploadMsg(e, f.name || 'fichier'), 'err'); }
      finally { setBusy(b => b - 1); }
    }
    // Dès qu'un fichier est ajouté, l'app le lit et remplit le devis.
    if (snap && !runningRef.current) calculer(snap);
  }
  const onPick = e => { const l = [...(e.target.files || [])]; e.target.value = ''; if (l.length) addFiles(l); };
  const filesFromClipboard = cd => {
    if (!cd) return [];
    const txt = cd.getData && cd.getData('text/plain');
    if (txt && txt.trim()) return [];
    const out = [];
    [...(cd.items || [])].forEach((it, i) => {
      if (it.kind !== 'file') return;
      const f = it.getAsFile(); if (!f) return;
      const ext = ((f.type || 'image/png').split('/')[1] || 'png').replace('jpeg', 'jpg');
      out.push(f.name && !/^image\.\w+$/i.test(f.name) ? f : new File([f], 'photo-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '-' + (i + 1) + '.' + ext, { type: f.type }));
    });
    return out;
  };
  const onBriefPaste = e => {
    const l = filesFromClipboard(e.clipboardData);
    if (!l.length) return;
    e.preventDefault();
    if (canUpload) addFiles(l); else notify('Les photos ne peuvent pas être enregistrées dans cette vue.', 'err');
  };
  useEffect(() => {
    if (!canUpload) return;
    const onDocPaste = e => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      const l = filesFromClipboard(e.clipboardData);
      if (l.length) { e.preventDefault(); addFiles(l); }
    };
    document.addEventListener('paste', onDocPaste);
    return () => document.removeEventListener('paste', onDocPaste);
  }, [canUpload]);
  async function removeFile(f) {
    setArmed(null);
    update(cur => ({ fichiers: (cur.fichiers || []).filter(x => x.id !== f.id) }));
    try { await removeStored(f); } catch (e) { }
  }
  async function openFile(f) {
    try { const b = await blobFor(f); await saveFile(withExt(f.nom, b.type || f.type), b, notify); }
    catch (e) { notify('Ce fichier ne peut pas être relu pour le moment.', 'err'); }
  }
  // Fichiers choisis depuis « Nouveau devis depuis un fichier »
  useEffect(() => {
    const pf = pendingFiles.get(ch.id);
    if (!pf || !canUpload) return;
    pendingFiles.delete(ch.id);
    addFiles(pf);
  }, [canUpload]);

  async function calculer(snapshot) {
    runningRef.current = true;
    try { await calculerInner(snapshot && snapshot.fichiers ? snapshot : chRef.current); }
    finally { runningRef.current = false; }
  }
  async function calculerInner(cur0) {
    const brief = String(cur0.brief || '').trim();
    ctl.current = new AbortController();
    const signal = ctl.current.signal;
    setRun({ state: 'running', step: 'Lecture des fichiers…' });
    const texts = [], images = [], unread = [];
    for (const f of (cur0.fichiers || []).slice(-10)) {
      const k = kindOf(f);
      try {
        if (k === 'image') { if (caps.images) images.push(await blobFor(f)); }
        else if (k === 'pdf') {
          const r = await extractPdf(f, !!caps.images);
          if (r.text.replace(/\s/g, '').length >= 30) texts.push('=== ' + f.nom + ' ===\n' + r.text);
          images.push(...r.images);
          if (r.text.replace(/\s/g, '').length < 30 && !r.images.length) unread.push(f.nom);
        } else if (['docx', 'sheet', 'text'].includes(k)) {
          const t = await extractText(f);
          if (t && t.trim()) texts.push('=== ' + f.nom + ' ===\n' + t.trim()); else unread.push(f.nom);
        } else unread.push(f.nom + (k === 'doc' ? ' (enregistre-le en .docx)' : ''));
      } catch (e) { unread.push(f.nom); }
      if (signal.aborted) { setRun({ state: 'idle' }); return; }
    }
    let docText = texts.join('\n\n');
    if (docText.length > 60000) docText = docText.slice(0, 60000) + '\n[…suite coupée]';
    const imgs = images.slice(-((caps.images && caps.images.maxCount) || 4));
    if (!brief && !docText && !imgs.length) {
      const hasNumbers = num(cur0.surface) > 0 || String(cur0.heuresManuel || '').trim();
      if (hasNumbers) { setRun({ state: 'done', via: 'none', items: [], missing: [], unread, obs: '' }); onShowDevis(); return; }
      setRun({ state: 'error', msg: unread.length ? 'Aucun fichier lisible (' + unread.join(', ') + '). Colle le texte ou décris le chantier dans la case.' : 'Ajoute d’abord des infos : écris ou colle un texte dans la case, ou ajoute un PDF, un Excel ou une photo.' });
      return;
    }
    let s = null, via = 'claude';
    if (svc.sample) {
      setRun({ state: 'running', step: 'Claude lit les infos du chantier… (jusqu’à une minute)' });
      try {
        const opts = { signal };
        if (imgs.length) opts.images = imgs;
        s = normalizeResult(await svc.sample.json(buildPrompt(brief, docText, imgs.length, cur0), opts));
      } catch (e) {
        if (e && e.code === 'cancelled') { setRun({ state: 'idle' }); return; }
        via = 'local';
      }
    } else via = 'local';
    if (!s) s = localParse([brief, docText].join('\n'));
    let before = null, after = null;
    update(cur => { before = clone(stripId(cur)); const p = patchFrom(s, cur, cfg); after = Object.assign({}, cur, p); return p; });
    const missing = [];
    if (after) {
      const hasZones = (after.zones || []).some(z => num(z.surface) > 0);
      if (!hasZones && !(num(after.surface) > 0) && !String(after.heuresManuel || '').trim()) missing.push('la surface (m²)');
      if (!(after.client && after.client.nom)) missing.push('le nom du client');
      if (!after.dateDebut) missing.push('la date de début');
    }
    setUndo(before);
    setRun({ state: 'done', via, items: summaryOf(s), missing, unread, obs: s.observations || '' });
    if (!missing.includes('la surface (m²)')) onShowDevis();
  }
  function annuler() {
    if (!undo) return;
    const rest = Object.assign({}, undo); delete rest.fichiers; delete rest.brief;
    update(() => rest);
    setUndo(null); setRun({ state: 'idle' });
    notify('Remplissage annulé.');
  }
  const onDrop = e => { e.preventDefault(); setOver(false); if (canUpload && e.dataTransfer && e.dataTransfer.files) addFiles([...e.dataTransfer.files]); };

  return html`<section className="sec quick">
    <h2 className="sec-h">Infos du chantier</h2>
    <p className="small muted">Ajoute le dossier du chantier (PDF, Excel, Word, photos) : l'app le lit tout de suite et remplit le client, les bâtiments, les surfaces, les phases, les heures, le prix et le planning. Tu peux aussi coller ou écrire le texte, puis appuyer sur « Calculer le devis ».</p>
    <${Field} label="Texte, description ou photo collée" hint="Ex. « Appartement 85 m², fin de rénovation, traces de plâtre au sol, vitres à faire, début le 12/11/2026, client Mme Martin 06 12 34 56 78 ». Tu peux coller ici le texte copié d'un PDF ou d'un Excel, ou une photo.">
      <textarea id="ch-brief" className="inp brief" value=${ch.brief || ''} placeholder="Colle ou écris les infos du chantier ici…" onChange=${e => update({ brief: e.target.value })} onPaste=${onBriefPaste}></textarea>
    <//>
    <div className=${'drop' + (over ? ' over' : '')} onDragOver=${e => { e.preventDefault(); if (canUpload) setOver(true); }} onDragLeave=${() => setOver(false)} onDrop=${onDrop}>
      <div className="small">
        ${canUpload ? html`<strong>Fichiers : PDF, Excel, Word ou photos</strong><br/><span className="muted">${busy ? 'Envoi en cours (' + busy + ')…' : '8 Mo max par fichier. Si le bouton n’ouvre rien dans l’app Claude du téléphone, colle le texte ou la photo dans la case au-dessus.'}</span>`
          : html`<span className="muted">Les fichiers s'enregistrent quand la page est ouverte dans Claude. Tu peux coller le texte dans la case au-dessus.</span>`}
      </div>
      ${canUpload ? html`<div className="btns">
        <span className="btn sm file-btn">Prendre une photo<input id="cam-in" type="file" accept="image/*" capture="environment" aria-label="Prendre une photo" onChange=${onPick} /></span>
        <span className="btn sm file-btn">Ajouter des fichiers<input id="file-in" type="file" multiple accept=${FILE_ACCEPT} aria-label="Ajouter des fichiers" onChange=${onPick} /></span>
      </div>` : null}
    </div>
    ${files.length ? html`<div className="files">${files.map(f => html`<div className="file" key=${f.id}>
        <${Thumb} f=${f} />
        <div className="fn" title=${f.nom}>${f.nom}</div>
        <div className="fa">
          <button type="button" className="open" onClick=${() => openFile(f)}>Ouvrir</button>
          ${canUpload ? html`<button type="button" className=${armed === f.id ? 'arm' : ''} onClick=${() => armed === f.id ? removeFile(f) : setArmed(f.id)}>${armed === f.id ? 'Confirmer' : 'Retirer'}</button>` : null}
        </div>
      </div>`)}</div>` : null}
    <${TeamSec} ch=${ch} cfg=${cfg} comp=${comp} update=${update} />
    <button type="button" className="btn primary block calc-btn" onClick=${calculer} disabled=${run.state === 'running'}>${run.state === 'running' ? 'Calcul en cours…' : run.state === 'done' ? 'Recalculer à partir des infos' : 'Calculer le devis'}</button>
    ${run.state === 'running' ? html`<div className="addrow" style=${{ alignItems: 'center' }}><span className="small muted">${run.step}</span><button type="button" className="btn ghost sm" onClick=${() => ctl.current && ctl.current.abort()}>Arrêter</button></div>` : null}
    ${run.state === 'error' ? html`<p className="warn-box">${run.msg}</p>` : null}
    ${run.state === 'done' ? html`<div className=${'result' + (run.missing.length ? ' partial' : '')}>
      <strong>${run.missing.length ? 'Devis calculé, à compléter' : 'Devis calculé'}${run.via === 'local' ? ' (lecture simple du texte, sans Claude)' : ''}</strong>
      ${run.items.length ? html`<span>Rempli : ${run.items.join(' · ')}.</span>` : run.via !== 'none' ? html`<span>Aucune nouvelle info trouvée : le devis utilise les champs déjà remplis.</span>` : null}
      ${run.missing.length ? html`<span>Manque : ${run.missing.join(', ')}. Ajoute-le dans la case ou dans les champs plus bas.</span>` : null}
      ${run.obs ? html`<span className="muted">${run.obs}</span>` : null}
      ${run.unread.length ? html`<span className="muted">Non lus : ${run.unread.join(', ')}.</span>` : null}
      <div className="addrow">
        <button type="button" className="btn sm" onClick=${onShowDevis}>Voir le devis</button>
        ${undo ? html`<button type="button" className="btn ghost sm" onClick=${annuler}>Annuler le remplissage</button>` : null}
      </div>
    </div>` : null}
  </section>`;
}

function ZonesSec({ ch, comp, update }) {
  const zones = ch.zones || [];
  const setZ = (k, f, v) => update(cur => ({ zones: (cur.zones || []).map(z => z.k === k ? Object.assign({}, z, { [f]: v }) : z) }));
  const addZ = () => update(cur => ({ zones: [...(cur.zones || []), { k: rid(), nom: '', surface: '', salissure: cur.salissure || 'normal', date: '', periode: '' }] }));
  const rmZ = k => update(cur => ({ zones: (cur.zones || []).filter(z => z.k !== k) }));
  const orgOf = k => comp.org.find(o => o.k === k);
  const auto = comp.modeEquipe === 'auto';
  return html`<section className="sec">
    <h2 className="sec-h">Bâtiments, zones et phases <span className="aside">${comp.zoneRows.length ? comp.zoneRows.length + ' lignes · ' + fmtNum(comp.surface, 0) + ' m² · ' + fmtH(comp.hours) : 'facultatif'}</span></h2>
    <p className="small muted">Pour un chantier en plusieurs bâtiments ou en plusieurs passages (premier de série, pré-OPR, OPR, réception) : une ligne par bâtiment et par phase, chacune avec son prix sur le devis.</p>
    ${zones.length ? html`<div className="lines">
      <div className="zhead" aria-hidden="true"><span>Bâtiment / phase</span><span>m²</span><span>Salissure</span><span>Début</span><span>Délai</span><span>Équipe · prix</span><span></span></div>
      ${zones.map(z => html`<div className="zrow" key=${z.k}>
      <input id=${'zn-' + z.k} className="inp z-n" placeholder="Ex. Nettoyage OPR – Gymnase neuf" value=${z.nom || ''} onChange=${e => setZ(z.k, 'nom', e.target.value)} aria-label="Bâtiment ou zone" />
      <input id=${'zs-' + z.k} className="inp" inputMode="decimal" placeholder="m²" value=${z.surface ?? ''} onChange=${e => setZ(z.k, 'surface', e.target.value)} aria-label="Surface en m²" />
      <select id=${'zl-' + z.k} className="inp" value=${z.salissure || ch.salissure || 'normal'} onChange=${e => setZ(z.k, 'salissure', e.target.value)} aria-label="Salissure">
        ${SALISSURES.map(s => html`<option key=${s.id} value=${s.id}>${s.label}</option>`)}
      </select>
      <input id=${'zd-' + z.k} className="inp" type="date" value=${z.date || ''} onChange=${e => setZ(z.k, 'date', e.target.value)} aria-label="Date de début" />
      <input id=${'zj-' + z.k} className="inp" inputMode="numeric" placeholder=${String(comp.delaiDefaut) + ' j'} value=${z.delai ?? ''} disabled=${!auto} onChange=${e => setZ(z.k, 'delai', e.target.value)} aria-label="Délai en jours ouvrés" title=${auto ? 'Délai en jours ouvrés' : 'Délai utilisé seulement quand l’app calcule l’équipe'} />
      <span className="z-h">${orgOf(z.k) ? html`<${Frag}>${orgOf(z.k).people} pers. · ${fmtH(orgOf(z.k).h)}<small>${orgOf(z.k).days} j · ${eur(orgOf(z.k).cost)}</small><//>` : '–'}</span>
      <button type="button" className="xbtn" aria-label="Supprimer la ligne" onClick=${() => rmZ(z.k)}>×</button>
      ${z.periode ? html`<span className="z-p">Prévu : ${z.periode}</span>` : null}
    </div>`)}</div>` : null}
    <div><button type="button" className="btn ghost sm" onClick=${addZ}>+ Ajouter un bâtiment ou une phase</button></div>
  </section>`;
}

function PrestaSec({ ch, comp, cfg, update }) {

  const toggle = id => update(cur => { const s = new Set(cur.prestations || []); if (s.has(id)) s.delete(id); else s.add(id); return { prestations: PRESTATIONS.map(p => p.id).filter(x => s.has(x)) }; });
  const sal = labelOf(SALISSURES, ch.salissure) || 'Normale';
  return html`<section className="sec">
    <h2 className="sec-h">Prestations et temps</h2>
    <ul className="checklist">${PRESTATIONS.map(p => html`<li key=${p.id}>
      <label className="check" htmlFor=${'p-' + p.id}>
        <input type="checkbox" id=${'p-' + p.id} checked=${sel.has(p.id)} onChange=${() => toggle(p.id)} />
        <span>${p.label}</span>
        <span className=${'badge' + (p.base ? ' base' : '')}>${p.base ? 'base' : '+' + fmtQ(num(cfg.coefs[p.id])) + ' %'}</span>
      </label></li>`)}</ul>
    <div className="calc" aria-live="polite">
      ${comp.zoneRows.length ? html`<${Frag}>
        <span>${comp.zoneRows.length} lignes</span><span className="op">·</span><span>${fmtNum(comp.surface, 0)} m²</span><span className="op">=</span><strong>${fmtH(comp.auto)}</strong>
        <span className="note">Chaque ligne : surface ÷ cadence de sa salissure × ${fmtQ(1 + comp.coefPct / 100)} (prestations cochées), arrondi à la demi-heure.</span>
      <//>` : comp.surface > 0 ? html`<${Frag}>
        <span>${fmtNum(comp.surface, 0)} m²</span><span className="op">÷</span><span>${fmtQ(comp.cad)} m²/h</span>
        <span className="op">×</span><span>${fmtQ(1 + comp.coefPct / 100)}</span><span className="op">=</span>
        <strong>${fmtH(comp.auto)}</strong><span className="muted">→ ${fmtH(comp.autoRounded)}</span>
        <span className="note">Cadence pour une salissure ${sal.toLowerCase()}, majorée des prestations cochées. Modifiable dans Réglages.</span>
      <//>` : html`<span className="muted">Indique la surface pour calculer le temps de travail.</span>`}
    </div>
    <div className="grid2">
      <${Field} label="Heures retenues" hint=${comp.manual ? 'Saisie manuelle. Vide le champ pour revenir au calcul.' : 'Calcul automatique. Saisis un nombre pour le remplacer.'}>
        <input id="h-man" className="inp" inputMode="decimal" placeholder=${comp.autoRounded ? fmtQ(comp.autoRounded) : '0'} value=${ch.heuresManuel ?? ''} onChange=${e => update({ heuresManuel: e.target.value })} />
      <//>
    </div>
  </section>`;
}

function EquipeSec({ ch, comp, sched, data, bookings, update, goTab }) {
  const emps = Object.values(data.employes).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const sel = new Set(ch.equipe || []);
  const toggle = id => update(cur => { const s = new Set(cur.equipe || []); if (s.has(id)) s.delete(id); else s.add(id); return { equipe: [...s] }; });
  const conflicts = [];
  const seen = new Set();
  sched.forEach(s => comp.team.forEach(e => {
    ((bookings.byEmp[e.id] || {})[s.date] || []).forEach(b => {
      if (b.ch.id === ch.id) return;
      const k = e.id + b.ch.id; if (seen.has(k)) return; seen.add(k);
      conflicts.push((e.nom || 'Un membre') + ' est déjà prévu sur ' + (b.ch.titre || b.ch.numero) + ' le ' + fmtDay(s.date) + '.');
    });
  }));
  return html`<section className="sec">
    <h2 className="sec-h">Planning <span className="aside">${comp.crewLabel}</span></h2>
    ${comp.hours > 0 ? html`<div className="team-sum">
      <span><strong>${fmtH(comp.hours)}</strong> de travail</span>
      <span><strong>${comp.org.length > 1 && comp.minPeople !== comp.maxPeople ? comp.minPeople + ' à ' + comp.maxPeople : comp.maxPeople || comp.n}</strong> ${(comp.maxPeople || comp.n) > 1 ? 'personnes' : 'personne'}</span>
      ${comp.org.length === 1 ? html`<span><strong>${fmtH(comp.perEmp)}</strong> par personne</span>` : null}
      <span><strong>${sched.length || comp.days}</strong> ${(sched.length || comp.days) > 1 ? 'jours ouvrés' : 'jour ouvré'}</span>
    </div>` : null}
    ${sched.length ? html`<div className="days">${sched.slice(0, 60).map(s => html`<span key=${s.date} className="day">${fmtDay(s.date)} · ${s.people} pers. · ${fmtH(s.h)}</span>`)}${sched.length > 60 ? html`<span className="day">… et ${sched.length - 60} autres jours</span>` : null}</div>`
      : comp.hours > 0 ? html`<p className="small muted">Choisis une date de début pour générer le planning.</p>` : null}
    ${conflicts.length ? html`<div className="warn-box">${conflicts.map((t, i) => html`<div key=${i}>${t}</div>`)}</div>` : null}
    <p className="small muted">Une fois le devis accepté, nomme les personnes de chaque phase dans <button type="button" className="link" onClick=${() => { const el = document.getElementById('exec'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }}>Chantier en cours et facturation</button>.</p>
  </section>`;
}

/* ----- Après acceptation : équipe nommée, avancement, factures ----- */
function ExecSec({ ch, comp, sched, data, cfg, bookings, update, put, notify }) {
  const accepted = ch.statut === 'accepte';
  const [open, setOpen] = useState(accepted);
  const [newName, setNewName] = useState({});
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (accepted) setOpen(true); }, [accepted]);
  const emps = Object.values(data.employes).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const units = comp.org;
  const daysOf = k => sched.filter(s => s.items.some(i => i.k === k)).map(s => s.date);
  const assigned = k => assignedTo(ch, k).filter(id => data.employes[id]);
  const setUnit = (k, ids) => update(cur => { const t = Object.assign({}, cur.travaux || {}); t[k] = Object.assign({}, t[k] || {}, { equipe: ids }); return { travaux: t }; });
  const toggle = (k, id) => { const s = new Set(assigned(k)); if (s.has(id)) s.delete(id); else s.add(id); setUnit(k, [...s]); };
  const conflictOf = (id, k) => {
    for (const d of daysOf(k)) { const other = ((bookings.byEmp[id] || {})[d] || []).find(b => b.ch.id !== ch.id); if (other) return 'Déjà prévu le ' + fmtDay(d) + ' sur ' + (other.ch.titre || other.ch.numero); }
    return '';
  };
  const addPerson = k => {
    const nom = String(newName[k] || '').trim(); if (!nom || !svc.backend) return;
    const id = svc.backend.newId();
    put('employes', id, { nom, poste: 'Agent de nettoyage', taux: String(num(cfg.tauxPostes.agent) || num(cfg.tauxDefaut)), tel: '', createdAt: Date.now() }, 0);
    setUnit(k, [...assigned(k), id]); setNewName(o => Object.assign({}, o, { [k]: '' }));
  };
  const b = billing(ch, comp);
  const setPct = (key, v) => update(cur => ({ avancement: Object.assign({}, cur.avancement || {}, { [key]: v }) }));
  const factures = ch.factures || [];
  async function loadLogoSafe() { return cfg.logo ? await loadLogo(cfg.logo).catch(() => null) : null; }
  async function pdfFacture(f) {
    if (!window.jspdf) { notify("Le module PDF n'a pas pu se charger.", 'err'); return; }
    const doc = facturePdf(f, ch, cfg, await loadLogoSafe());
    await saveFile(safeName((f.type === 'acompte' ? 'Facture acompte ' : 'Facture ') + f.numero + ' ' + ((ch.client && ch.client.nom) || '')) + '.pdf', doc.output('blob'), notify);
  }
  async function creer(type) {
    if (busy) return; setBusy(true);
    try {
      const f = makeFacture(type, ch, comp, cfg, nextFactureNumero(data.chantiers));
      update(cur => ({ factures: [...(cur.factures || []), f] }));
      notify('Facture ' + f.numero + ' créée : ' + eur(f.ttc) + '.');
      await pdfFacture(f);
    } finally { setBusy(false); }
  }
  async function pdfPlanning() {
    if (!window.jspdf) { notify("Le module PDF n'a pas pu se charger.", 'err'); return; }
    const doc = planningEquipePdf(ch, comp, sched, data.employes, cfg, await loadLogoSafe());
    await saveFile(safeName('Planning équipe ' + ch.numero) + '.pdf', doc.output('blob'), notify);
  }
  const setPaye = (id, v) => update(cur => ({ factures: (cur.factures || []).map(f => f.id === id ? Object.assign({}, f, { paye: v }) : f) }));
  const removeLast = () => update(cur => ({ factures: (cur.factures || []).slice(0, -1) }));
  const lastF = factures[factures.length - 1];
  const totalFactureTTC = factures.reduce((s, f) => s + f.ttc, 0);
  const totalPaye = factures.filter(f => f.paye).reduce((s, f) => s + f.ttc, 0);
  const named = units.reduce((s, o) => s + Math.min(o.people, assigned(o.k).length), 0);
  const needed = units.reduce((s, o) => s + o.people, 0);

  return html`<section className=${'sec exec' + (accepted ? ' on' : '')} id="exec">
    <button type="button" className="exec-h" aria-expanded=${open} onClick=${() => setOpen(o => !o)}>
      <span className="sec-h">Chantier en cours et facturation</span>
      <span className=${'pill ' + (accepted ? 's-accepte' : 's-brouillon')}>${accepted ? (b.realiseHT > 0 ? fmtQ(Math.round(b.realiseHT / Math.max(1, comp.ht) * 100)) + ' % réalisé' : 'devis accepté') : 'après acceptation'}</span>
      <span className="chev" aria-hidden="true">${open ? '−' : '+'}</span>
    </button>
    ${open ? html`<${Frag}>
      ${!accepted ? html`<p className="small warn-box">Cette partie sert une fois le devis signé. Passe le statut en haut à « Accepté » quand le client a renvoyé le devis avec « Bon pour accord ».</p>` : null}

      <div className="subh">1. Qui travaille sur chaque phase ${needed ? html`<span className="aside">${named}/${needed} personnes nommées</span>` : null}</div>
      ${!units.length ? html`<p className="small muted">Le devis n’a pas encore d’heures de travail.</p>` : html`<div className="units">${units.map(o => {
        const ids = assigned(o.k); const days = daysOf(o.k);
        return html`<div className="unit" key=${o.k}>
          <div className="unit-h"><strong>${o.nom}</strong><span className="muted small">${days.length ? fmtRange(days[0], days[days.length - 1]) : 'dates à fixer'} · ${o.people} ${o.people > 1 ? 'personnes' : 'personne'} (${o.label}) · ${fmtH(o.perPerson)} chacun</span></div>
          <div className="chips">${emps.map(e => { const on = ids.includes(e.id); const cf = on ? '' : conflictOf(e.id, o.k);
            return html`<button type="button" key=${e.id} className=${'chip' + (cf ? ' busy' : '')} aria-pressed=${on} title=${cf || e.poste || ''} onClick=${() => toggle(o.k, e.id)}>${e.nom || 'Sans nom'}${cf ? html`<span className="cnt">occupé</span>` : null}</button>`; })}</div>
          <div className="addrow">
            <input id=${'np-' + o.k} className="inp np" placeholder="Nouvelle personne (prénom nom)" value=${newName[o.k] || ''} onChange=${e => { const v = e.target.value; setNewName(x => Object.assign({}, x, { [o.k]: v })); }} onKeyDown=${e => { if (e.key === 'Enter') addPerson(o.k); }} />
            <button type="button" className="btn sm" onClick=${() => addPerson(o.k)} disabled=${!String(newName[o.k] || '').trim()}>Ajouter</button>
            <span className=${'small ' + (ids.length >= o.people ? 'ok-t' : 'muted')}>${Math.min(ids.length, o.people)}/${o.people}${ids.length > o.people ? ' (+' + (ids.length - o.people) + ' en plus)' : ''}</span>
          </div>
        </div>`; })}</div>`}
      ${units.length ? html`<div className="addrow"><button type="button" className="btn" onClick=${pdfPlanning} disabled=${!sched.length}>Télécharger le planning de l’équipe (PDF)</button><span className="tiny muted">Jour par jour, avec les noms. Visible aussi dans l’onglet Planning.</span></div>` : null}

      <div className="subh">2. Avancement des travaux</div>
      <p className="tiny muted">Indique ce qui est fait. La prochaine facture reprend seulement ce qui n’a pas encore été facturé.</p>
      <div className="av-list">${b.rows.map(r => html`<div className="av" key=${r.key}>

    update(cur => {
      const list = (cur.materiel || []).slice(); const i = list.findIndex(r => r.id === pick);

        <input id=${'mq-' + r.id} className="inp" inputMode="decimal" aria-label=${'Quantité ' + (m.nom || '')} value=${r.qte} onChange=${e => setQ(r.id, e.target.value)} />
        <div className="tt">${eur(round2(tot))}</div>

    <div className="subh">Lignes libres</div>
    ${extras.length ? html`<div className="lines">${extras.map(x => html`<div className="xrow" key=${x.k}>
      <input id=${'xl-' + x.k} className="inp x-l" placeholder="Ex. Location benne 6 m³" value=${x.label} onChange=${e => setX(x.k, 'label', e.target.value)} aria-label="Désignation" />

/* ----- Planning ----- */
function Planning({ data, cfg, bookings, onOpen, notify }) {
  const [week, setWeek] = useState(() => iso(mondayOf(new Date())));
  const nd = cfg.samedi ? 6 : 5;
  const days = useMemo(() => Array.from({ length: nd }, (_, i) => iso(addDays(parseIso(week), i))), [week, nd]);
  const today = iso(new Date());
  const hpd = num(cfg.heuresParJour) || 8;
  const emps = Object.values(data.employes).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const rows = emps.map(e => ({ id: e.id, label: e.nom || 'Sans nom', sub: e.poste || '', cells: bookings.byEmp[e.id] || {} }));
  if (days.some(d => bookings.sansEquipe[d])) rows.push({ id: '_none', label: 'Personnes non nommées', sub: 'équipe chiffrée, à attribuer', cells: bookings.sansEquipe, none: true });
  const inWeek = new Map();
  rows.forEach(r => days.forEach(d => (r.cells[d] || []).forEach(b => inWeek.set(b.ch.id, b.ch))));
  const conflictCount = rows.reduce((s, r) => s + days.filter(d => b_conflict(r, d, hpd)).length, 0);
  const d0 = parseIso(week);
  const label = 'Semaine ' + isoWeek(d0) + ' · ' + fmtDay(days[0]) + ' – ' + fmtLong(days[days.length - 1]);

  async function exportPdf() {
    if (!window.jspdf) { notify("Le module PDF n'a pas pu se charger. Recharge la page.", 'err'); return; }
    const pdfRows = rows.map(r => ({ label: r.label, sub: r.sub, none: r.none, cells: Object.fromEntries(days.map(d => [d, (r.cells[d] || []).map(b => ({ numero: b.ch.numero, titre: b.ch.titre || (b.ch.client && b.ch.client.nom) || 'Chantier', adresse: b.ch.adresse || '', h: b.h, prov: b.ch.statut !== 'accepte', ci: colorIdx(b.ch.id) }))])) }));
    try {
      const doc = planningPdf({ weekLabel: label, days, rows: pdfRows, cfg, hpd });
      await saveFile(safeName('Planning semaine ' + isoWeek(d0) + ' ' + d0.getFullYear()) + '.pdf', doc.output('blob'), notify);
    } catch (e) { notify('La création du PDF a échoué.', 'err'); }
  }

  return html`<section>
    <div className="page-h">
      <div><h1>Planning</h1><p className="sub">Qui travaille sur quel chantier, jour par jour, calculé à partir des devis.</p></div>
      <button className="btn" onClick=${exportPdf}>Télécharger le planning PDF</button>
    </div>
    <div className="pl-nav">
      <button className="btn sm" aria-label="Semaine précédente" onClick=${() => setWeek(iso(addDays(parseIso(week), -7)))}>←</button>
      <div className="wk">Semaine ${isoWeek(d0)}<small>${fmtDay(days[0])} – ${fmtLong(days[days.length - 1])}</small></div>
      <button className="btn sm" aria-label="Semaine suivante" onClick=${() => setWeek(iso(addDays(parseIso(week), 7)))}>→</button>
      <button className="btn ghost sm" onClick=${() => setWeek(iso(mondayOf(new Date())))}>Cette semaine</button>
      ${conflictCount ? html`<span className="pill s-refuse">${conflictCount} conflit${conflictCount > 1 ? 's' : ''}</span>` : null}
    </div>
    ${!rows.length ? html`<div className="empty"><h2>Pas encore d'équipe</h2><p className="muted">Ajoute les membres de ton équipe, puis attribue-les aux chantiers : le planning se remplit tout seul.</p></div>`
      : html`<div className="pl-scroll"><div className="pl-grid" style=${{ gridTemplateColumns: 'minmax(128px,1.1fr) repeat(' + days.length + ', minmax(124px,1fr))' }}>
        <div className="pl-corner">Équipe</div>
        ${days.map(d => html`<div key=${d} className=${'pl-day' + (d === today ? ' today' : '')}>${fmtDay(d)}</div>`)}
        ${rows.map(r => html`<${Frag} key=${r.id}>
          <div className=${'pl-who' + (r.none ? ' none' : '')}><strong>${r.label}</strong><span>${r.sub}</span></div>
          ${days.map(d => { const list = r.cells[d] || []; const cf = b_conflict(r, d, hpd);
            return html`<div key=${d} className=${'pl-cell' + (cf ? ' conflict' : '') + (d === today ? ' today' : '')}>
              ${list.map((b, bi) => html`<button key=${b.ch.id + '-' + bi} className=${'blk c' + colorIdx(b.ch.id) + (b.ch.statut !== 'accepte' ? ' prov' : '')} onClick=${() => onOpen(b.ch.id)}>
                <span className="blk-n">${b.ch.numero}</span>
                <span className="blk-t">${b.ch.titre || (b.ch.client && b.ch.client.nom) || 'Chantier'}</span>
                <span className="blk-h">${b.people ? b.people + ' pers. · ' : ''}${fmtH(b.h)}${b.ch.statut !== 'accepte' ? ' · provisoire' : ''}</span>
              </button>`)}
              ${cf ? html`<span className="pl-flag">Conflit</span>` : null}
            </div>`; })}
        <//>`)}
      </div></div>`}
    ${rows.length && !inWeek.size ? html`<p className="muted small" style=${{ marginTop: '10px' }}>Aucune intervention prévue cette semaine.</p>` : null}
    <div className="legend">
      <span><i className="sw"></i>Devis accepté</span>
      <span><i className="sw prov"></i>Brouillon ou envoyé (provisoire)</span>
      <span><i className="sw cf"></i>Même personne sur deux chantiers</span>
    </div>
  </section>`;
}

      <${Field} label="Prix HT (€)"><input id=${'m-prix-' + m.id} className="inp" inputMode="decimal" value=${m.prix ?? ''} onChange=${ev => set('prix', ev.target.value)} /><//>
    </div>
    <div className="rc-foot"><span></span><${ConfirmBtn} className="btn ghost sm" label="Supprimer" confirmLabel="Confirmer la suppression" onConfirm=${() => del('materiel', m.id)} /></div>
  </div>`;
}

/* ----- Réglages ----- */
function Sauvegarde({ data, put, notify }) {
  const [pending, setPending] = useState(null);
  const counts = d => ['chantiers', 'employes', 'materiel'].map(c => Object.keys(d[c] || {}).length);
  async function exporter() {
    const strip = col => Object.fromEntries(Object.entries(col || {}).map(([id, v]) => [id, stripId(v)]));
    const payload = { app: 'devis-chantier', version: 1, exporte: new Date().toISOString(),
      chantiers: strip(data.chantiers), employes: strip(data.employes), materiel: strip(data.materiel), config: strip(data.config) };
    const blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    await saveFile('sauvegarde-devis-chantier-' + iso(new Date()) + '.json', blob, notify);
  }
  async function lire(e) {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (!j || j.app !== 'devis-chantier') throw new Error('format');
      setPending(j);
    } catch (err) { notify('Ce fichier n’est pas une sauvegarde de Devis Chantier.', 'err'); }
  }
  function importer(mode) {
    const j = pending; setPending(null);
    const cols = mode === 'reglages' ? ['employes', 'materiel', 'config'] : ['chantiers', 'employes', 'materiel', 'config'];
    let n = 0;
    cols.forEach(c => Object.entries(j[c] || {}).forEach(([id, v]) => {
      if (!v || typeof v !== 'object' || !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)) return;
      const clean = Object.assign({}, v); if (c === 'chantiers') clean.fichiers = [];
      put(c, id, clean, 0); n++;
    }));
    notify(n + ' élément' + (n > 1 ? 's' : '') + ' importé' + (n > 1 ? 's' : '') + '.');
  }
  const [c, e, m] = counts(data);
  return html`<div className="set-sec">
    <h2 className="sec-h">Sauvegarde et partage</h2>
    <p className="small muted">Exporte tout dans un fichier pour le garder en sécurité, ou pour l’envoyer à quelqu’un qui utilise aussi l’app : il pourra importer tes réglages, ton équipe, ton matériel et tes devis. Les photos et documents joints ne sont pas inclus.</p>
    <div className="addrow">
      <button type="button" className="btn" onClick=${exporter}>Exporter une sauvegarde (${c} devis, ${e} personnes, ${m} articles)</button>
      <span className="btn ghost file-btn">Importer une sauvegarde<input id="imp-in" type="file" accept="application/json,.json" aria-label="Importer une sauvegarde" onChange=${lire} /></span>
    </div>
    ${pending ? html`<div className="warn-box">
      <p>Sauvegarde du ${pending.exporte ? fmtLong(String(pending.exporte).slice(0, 10)) : '?'} : ${counts(pending)[0]} devis, ${counts(pending)[1]} personnes, ${counts(pending)[2]} articles. Que veux-tu importer ? Les éléments déjà présents avec le même identifiant seront remplacés.</p>
      <div className="addrow" style=${{ marginTop: '8px' }}>
        <button type="button" className="btn sm" onClick=${() => importer('reglages')}>Réglages, équipe et matériel</button>
        <button type="button" className="btn sm" onClick=${() => importer('tout')}>Tout, devis compris</button>
        <button type="button" className="btn ghost sm" onClick=${() => setPending(null)}>Annuler</button>
      </div>
    </div>` : null}
  </div>`;
}

function Reglages({ cfg, put, caps, notify, data }) {
  const latest = useRef(cfg); latest.current = cfg;
  const set = (patch) => { const p = typeof patch === 'function' ? patch(latest.current) : patch; const next = Object.assign({}, latest.current, p); latest.current = next; put('config', 'entreprise', next); };
  const [logoBusy, setLogoBusy] = useState(false);
  async function onLogo(e) {
    const f0 = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f0) return;
    setLogoBusy(true);
    try {
      const f = await prepareImage(f0);
      const type = typeFor(f, f.name || f0.name);
      if (type !== 'image/png' && type !== 'image/jpeg') { notify('Le logo doit être une image PNG ou JPEG.', 'err'); return; }
      const entry = await storeFile(f, f.name || f0.name);
      const old = latest.current.logo;
      set({ logo: entry });
      if (old) removeStored(old).catch(() => { });
    } catch (err) { notify(uploadMsg(err, f0.name), 'err'); }
    finally { setLogoBusy(false); }
  }
  function removeLogo() { const old = latest.current.logo; set({ logo: null }); if (old) removeStored(old).catch(() => { }); }
  const inp = (k, label, extra) => html`<${Field} label=${label} hint=${extra && extra.hint}><input id=${'cfg-' + k} className="inp" inputMode=${extra && extra.dec ? 'decimal' : undefined} placeholder=${(extra && extra.ph) || ''} value=${cfg[k] ?? ''} onChange=${e => set({ [k]: e.target.value })} /><//>`;
  return html`<section>
    <div className="page-h"><div><h1>Réglages</h1><p className="sub">L'en-tête de tes devis et les bases du calcul.</p></div></div>
    <div className="set-sec">
      <h2 className="sec-h">Entreprise</h2>
      <div className="grid2">
        ${inp('nom', 'Nom commercial', { ph: 'Ex. Net Chantier' })}
        ${inp('forme', 'Statut juridique', { ph: 'Ex. EI, ou SAS au capital de 1 000 €', hint: 'Obligatoire. Entrepreneur individuel : écris « EI ». Société : forme, capital et ville du RCS.' })}
        ${inp('siret', 'SIRET', { ph: '123 456 789 00012', hint: '14 chiffres, sur ton avis de situation Insee.' })}
        ${inp('tva', 'N° TVA intracommunautaire', { ph: 'FR12 123456789' })}
        ${inp('adresse', 'Adresse', { ph: 'N°, rue' })}
        ${inp('cpVille', 'Code postal et ville', { ph: '75011 Paris' })}
        ${inp('pays', 'Pays', { ph: 'France' })}
        ${inp('tel', 'Téléphone')}
        ${inp('email', 'E-mail')}
        ${inp('iban', 'IBAN', { ph: 'FR76 …', hint: 'Imprimé dans les conditions de paiement.' })}
        ${inp('assurance', 'Assurance professionnelle', { ph: 'Ex. AXA, contrat RC Pro n° 1234, France', hint: 'Assureur, n° de contrat et zone couverte, imprimés sur le devis.' })}
      </div>
      <div className="logo-box">
        ${cfg.logo ? html`<div style=${{ width: '120px' }}><${Thumb} f=${cfg.logo} /></div>` : null}
        ${caps.store ? html`<${Frag}>
          <span className="btn sm file-btn">${logoBusy ? 'Envoi…' : cfg.logo ? 'Changer le logo' : 'Ajouter un logo'}<input id="logo-in" type="file" accept="image/png,image/jpeg" aria-label="Logo" onChange=${onLogo} /></span>
          ${cfg.logo ? html`<button className="btn ghost sm" onClick=${removeLogo}>Retirer</button>` : null}
          <span className="tiny muted">PNG ou JPEG, affiché en haut à gauche du devis.</span>
        <//>` : html`<span className="tiny muted">Le logo s'ajoute quand la page est ouverte dans Claude.</span>`}
      </div>
    </div>
    <div className="set-sec">
      <h2 className="sec-h">Devis</h2>
      <label className="switch" htmlFor="cfg-franchise"><input id="cfg-franchise" type="checkbox" checked=${!!cfg.franchise} onChange=${e => set({ franchise: e.target.checked })} />Mon entreprise ne facture pas de TVA (micro-entreprise en franchise de TVA)</label>
      <p className="tiny muted">Coche seulement si ton comptable ou l’URSSAF te l’a confirmé. Sinon l’app applique la TVA française automatiquement selon le client : 20 %, 10 % pour certains travaux chez un particulier, ou autoliquidation en sous-traitance du bâtiment.</p>
      <div className="grid3">
        ${inp('tauxTVA', 'Taux normal de TVA (%)', { dec: true, hint: '20 % en France.' })}
        ${inp('validite', 'Validité (jours)', { dec: true })}
        ${inp('tauxDefaut', 'Taux horaire par défaut (€ HT)', { dec: true, hint: 'Utilisé tant que l’équipe n’est pas choisie.' })}
        ${inp('acomptePct', 'Acompte à la commande (%)', { dec: true, hint: '0 pour ne pas demander d’acompte.' })}
        ${inp('delaiPaiement', 'Délai de paiement des factures (jours)', { dec: true, hint: '30 jours en général entre entreprises.' })}
      </div>
      <div className="subh">Taux horaires facturés par poste (€ HT)</div>
      <div className="coefs">${ROLES.map(r => html`<label key=${r.id} className="coef" htmlFor=${'tp-' + r.id}><span>${r.label}</span>
        <input id=${'tp-' + r.id} className="inp" inputMode="decimal" value=${cfg.tauxPostes[r.id] ?? ''} onChange=${e => set(cur => ({ tauxPostes: Object.assign({}, cur.tauxPostes, { [r.id]: e.target.value }) }))} /></label>`)}</div>
      <${Field} label="Conditions générales" hint="Imprimées en bas du devis.">
        <textarea id="cfg-cond" className="inp" style=${{ minHeight: '110px' }} value=${cfg.conditions || ''} onChange=${e => set({ conditions: e.target.value })}></textarea>
      <//>
    </div>
    <div className="set-sec">
      <h2 className="sec-h">Calcul du temps</h2>
      <p className="small muted">Heures = surface ÷ cadence × (1 + majorations des prestations cochées), arrondi à la demi-heure.</p>
      <div className="grid3">
        ${SALISSURES.map(s => html`<${Field} key=${s.id} label=${'Cadence ' + s.label.toLowerCase() + ' (m²/h)'} hint=${s.hint}><input id=${'cad-' + s.id} className="inp" inputMode="decimal" value=${cfg.cadences[s.id] ?? ''} onChange=${e => set(cur => ({ cadences: Object.assign({}, cur.cadences, { [s.id]: e.target.value }) }))} /><//>`)}
      </div>
      <div className="subh">Majorations par prestation (%)</div>
      <div className="coefs">${PRESTATIONS.filter(p => !p.base).map(p => html`<label key=${p.id} className="coef" htmlFor=${'coef-' + p.id}><span>${p.label}</span>
        <input id=${'coef-' + p.id} className="inp" inputMode="decimal" value=${cfg.coefs[p.id] ?? ''} onChange=${e => set(cur => ({ coefs: Object.assign({}, cur.coefs, { [p.id]: e.target.value }) }))} /></label>`)}</div>
      <div className="grid3">
        ${inp('heuresParJour', 'Heures par jour et par personne', { dec: true, hint: '7 h pour 35 h par semaine.' })}
        ${inp('delaiDefaut', 'Délai par défaut (jours ouvrés)', { dec: true, hint: 'Utilisé quand le dossier ne donne pas de délai.' })}
        ${inp('ratioChef', 'Un chef d’équipe pour … personnes', { dec: true, hint: 'L’app ajoute un chef d’équipe à partir de 3 personnes.' })}
      </div>
      <label className="switch" htmlFor="cfg-sam"><input id="cfg-sam" type="checkbox" checked=${!!cfg.samedi} onChange=${e => set({ samedi: e.target.checked })} />Travailler le samedi dans le planning</label>
      <label className="switch" htmlFor="cfg-cadok"><input id="cfg-cadok" type="checkbox" checked=${!!cfg.cadencesOk} onChange=${e => set({ cadencesOk: e.target.checked })} />Ces cadences correspondent à la vitesse réelle de mes équipes</label>
      <p className="tiny muted">Pour trouver ta cadence : chronomètre une personne sur une pièce dont tu connais la surface, puis divise les m² par le temps en heures.</p>
    </div>
    <${Sauvegarde} data=${data} put=${put} notify=${notify} />
  </section>`;
}

/* ----- Application ----- */
function App() {
  const [store, setStore] = useState({ chantiers: {}, employes: {}, materiel: {}, config: {}, ready: false });
  const [overrides, setOverrides] = useState({});
  const [mode, setMode] = useState('loading');
  const [stale, setStale] = useState(false);
  const [status, setStatus] = useState('saved');
  const [caps, setCaps] = useState({ assets: false, sample: false, downloads: false, images: null, store: false });
  const [tab, setTabState] = useState('chantiers');
  const [openId, setOpenId] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const notify = useCallback((msg, kind) => {
    clearTimeout(toastTimer.current);
    setToast({ msg, kind: kind || 'ok' });
    toastTimer.current = setTimeout(() => setToast(null), kind === 'err' ? 6000 : 3200);
  }, []);

  useEffect(() => {
    statusListener = (s, err) => { setStatus(s); if (err) notify(writeErrMsg(err), 'err'); };
    let unsub = null, dead = false;
    const timer = setTimeout(() => setStale(true), 10000);
    (async () => {
      const db = await useCap('db');
      if (dead) return;
      svc.db = db || null;
      svc.backend = db ? makeDbBackend(db) : makeLocalBackend();
      setMode(svc.backend.mode);
      if (db || (STANDALONE && IDB.ok)) setCaps(c => Object.assign({}, c, { store: true }));
      unsub = svc.backend.watch(s => {
        if (s.ready) { clearTimeout(timer); setStale(false); }
        setStore(s);
        setOverrides(prev => { let changed = false; const next = {}; Object.keys(prev).forEach(k => { if (svc.writer.busy(k)) next[k] = prev[k]; else changed = true; }); return changed ? next : prev; });
      }, () => { clearTimeout(timer); setStale(true); });
    })();
    (async () => {
      const [assets, sample, downloads] = await Promise.all([useCap('assets'), useCap('sample'), useCap('downloads')]);
      svc.assets = assets; svc.sample = sample; svc.downloads = downloads;
      let images = null;
      if (sample && typeof sample.limits === 'function') { try { const l = await sample.limits(); images = l.images || null; } catch (e) { } }
      if (!dead) setCaps(c => ({ assets: !!assets, sample: !!sample, downloads: !!downloads || STANDALONE, images, store: !!assets || !!svc.db || c.store || (STANDALONE && IDB.ok) }));
    })();
    const onHide = () => svc.writer.flushAll();
    window.addEventListener('pagehide', onHide);
    return () => { dead = true; if (unsub) unsub(); clearTimeout(timer); window.removeEventListener('pagehide', onHide); };
  }, [notify]);

  const data = useMemo(() => {
    const d = { chantiers: Object.assign({}, store.chantiers), employes: Object.assign({}, store.employes), materiel: Object.assign({}, store.materiel), config: Object.assign({}, store.config) };
    Object.keys(overrides).forEach(path => { const [c, id] = path.split('/'); if (!d[c]) return; if (overrides[path] === null) delete d[c][id]; else d[c][id] = Object.assign({}, overrides[path], { id }); });
    return d;
  }, [store, overrides]);
  const cfg = useMemo(() => mergeCfg(data.config.entreprise), [data.config]);
  const bookings = useMemo(() => buildBookings(data.chantiers, cfg, data.employes, data.materiel), [data, cfg]);

  const put = useCallback((col, id, obj, delay) => {
    const path = col + '/' + id; const clean = stripId(obj);
    setOverrides(o => Object.assign({}, o, { [path]: clean }));
    svc.writer.schedule(path, clean, delay);
  }, []);
  const del = useCallback(async (col, id) => {
    const path = col + '/' + id;
    setOverrides(o => Object.assign({}, o, { [path]: null }));
    try { await svc.writer.remove(path); } catch (e) { setOverrides(o => { const n = Object.assign({}, o); delete n[path]; return n; }); }
  }, []);

  const setTab = t => { svc.writer.flushAll(); if (t === 'chantiers' && tab === 'chantiers') setOpenId(null); setTabState(t); window.scrollTo(0, 0); };
  const openChantier = id => { setTabState('chantiers'); setOpenId(id); window.scrollTo(0, 0); };
  const create = () => {
    if (!svc.backend) return;
    const id = svc.backend.newId();
    put('chantiers', id, newChantier(nextNumero(data.chantiers)), 0);
    openChantier(id);
  };
  const createFromFiles = files => {
    if (!svc.backend) return;
    const id = svc.backend.newId();
    const base = newChantier(nextNumero(data.chantiers));
    base.titre = String(files[0].name || '').replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim().slice(0, 100);
    base.titreAuto = true;
    pendingFiles.set(id, files);
    put('chantiers', id, base, 0);
    openChantier(id);
  };
  const open = tab === 'chantiers' && openId ? data.chantiers[openId] : null;
  useEffect(() => { if (openId && store.ready && !data.chantiers[openId]) setOpenId(null); }, [openId, data, store.ready]);

  const duplicate = () => {
    if (!open || !svc.backend) return;
    const id = svc.backend.newId();
    const copy = Object.assign(clone(stripId(open)), { numero: nextNumero(data.chantiers), statut: 'brouillon', createdAt: Date.now(), fichiers: [], titre: (open.titre || 'Chantier') + ' (copie)' });
    put('chantiers', id, copy, 0); openChantier(id); notify('Copie créée : ' + copy.numero);
  };
  const removeChantier = async () => {
    if (!open) return;
    const files = open.fichiers || []; const id = open.id;
    setOpenId(null);
    await del('chantiers', id);
    files.forEach(f => removeStored(f).catch(() => { }));
    notify('Chantier supprimé.');
  };

  const canWrite = !!svc.backend;
  return html`<div className=${open ? 'has-bar' : ''}>
    <${Header} tab=${tab} setTab=${setTab} status=${status} mode=${mode} />
    <main className="wrap main">
      ${mode === 'local' && !STANDALONE ? html`<p className="banner" style=${{ marginTop: 0, marginBottom: '16px' }}>Mode aperçu : les données restent dans ce navigateur. Ouvre la page dans Claude pour les retrouver sur tous tes appareils.</p>` : null}
      ${mode === 'local' && STANDALONE && tab === 'chantiers' && !openId ? html`<p className="small muted" style=${{ marginBottom: '14px' }}>Tes devis sont enregistrés sur cet appareil. Fais une sauvegarde de temps en temps dans Réglages.</p>` : null}
      ${stale ? html`<p className="banner" style=${{ marginTop: 0, marginBottom: '16px' }}>Les données ne répondent pas encore. Vérifie ta connexion : la page se met à jour d'elle-même.</p>` : null}
      ${tab === 'chantiers' && (open
        ? html`<${Editor} key=${open.id} ch=${open} data=${data} cfg=${cfg} bookings=${bookings} caps=${caps} put=${put} del=${removeChantier} onBack=${() => { svc.writer.flushAll(); setOpenId(null); }} onDuplicate=${duplicate} notify=${notify} goTab=${setTab} />`
        : html`<${ChantierList} data=${data} cfg=${cfg} onOpen=${openChantier} onCreate=${create} onCreateFromFiles=${createFromFiles} canCreate=${canWrite} ready=${store.ready} />`)}
      ${tab === 'planning' ? html`<${Planning} data=${data} cfg=${cfg} bookings=${bookings} onOpen=${openChantier} notify=${notify} />` : null}
      ${tab === 'equipe' ? html`<${EquipeTab} data=${data} cfg=${cfg} bookings=${bookings} put=${put} del=${del} canAdd=${canWrite} />` : null}
      ${tab === 'materiel' ? html`<${MaterielTab} data=${data} put=${put} del=${del} canAdd=${canWrite} />` : null}
      ${tab === 'reglages' ? html`<${Reglages} cfg=${cfg} put=${put} caps=${caps} notify=${notify} data=${data} />` : null}
    </main>
    ${toast ? html`<div className=${'toast ' + toast.kind} role="status">${toast.msg}</div>` : null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
