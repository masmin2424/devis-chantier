<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D5BD6">
<meta name="description" content="Devis de nettoyage de fin de chantier : lecture des dossiers, calcul des heures et de l’équipe, TVA française, planning et PDF.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Devis Nettoyage Chantier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  /* Layout: sticky header + tabs over a 1160px column. Chantier editor = form sheet + sticky devis "paper" on wide screens; on phones they stack and a fixed bar keeps the total and the PDF button in reach. */
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --paper:#FFFFFF;
  --ink:#15202C; --muted:#5A6676; --line:#D7DDE4; --line-strong:#B6C0CB;
  --accent:#1D5BD6; --accent-ink:#FFFFFF; --accent-soft:#E3EBFB;
  --ok:#1A7A4B; --ok-soft:#DCF0E5; --warn:#8F5B05; --warn-soft:#FAEDD3; --bad:#B8321F; --bad-soft:#FADFDA;
  --c1:#1D5BD6; --c2:#C0561A; --c3:#14806B; --c4:#8746B5; --c5:#A57A12; --c6:#BE3A6B;
  --shadow:0 1px 2px rgba(21,32,44,.06),0 10px 28px rgba(21,32,44,.07);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#161E27; --surface-2:#1C2631; --paper:#1A232D;
    --ink:#E5EBF1; --muted:#93A0AF; --line:#28333F; --line-strong:#3A4755;
    --accent:#6A9BF2; --accent-ink:#0A1322; --accent-soft:#1A2943;
    --ok:#4FC189; --ok-soft:#14301F; --warn:#E3AE52; --warn-soft:#33270F; --bad:#F27462; --bad-soft:#3A1A16;
    --c1:#6A9BF2; --c2:#EE8A4D; --c3:#3DC4A6; --c4:#B98BE6; --c5:#D9B04A; --c6:#EA75A1;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E27; --surface-2:#1C2631; --paper:#1A232D;
  --ink:#E5EBF1; --muted:#93A0AF; --line:#28333F; --line-strong:#3A4755;
  --accent:#6A9BF2; --accent-ink:#0A1322; --accent-soft:#1A2943;
  --ok:#4FC189; --ok-soft:#14301F; --warn:#E3AE52; --warn-soft:#33270F; --bad:#F27462; --bad-soft:#3A1A16;
  --c1:#6A9BF2; --c2:#EE8A4D; --c3:#3DC4A6; --c4:#B98BE6; --c5:#D9B04A; --c6:#EA75A1;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12.5px}
.num,.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:-.01em}
.tab-n{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand-mark{width:26px;height:13px;background:var(--accent);transform:rotate(-9deg);clip-path:polygon(0 0,100% 0,96% 20%,100% 40%,96% 60%,100% 80%,96% 100%,0 100%,4% 80%,0 60%,4% 40%,0 20%);opacity:.92}
.save{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.save .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save.saving .dot{background:var(--warn)} .save.error{color:var(--bad)} .save.error .dot{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 12px 10px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}

.main{padding-block:22px 64px}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}

/* Generic */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:clamp(24px,4vw,30px);letter-spacing:-.015em;line-height:1.1}
.page-h .sub{color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13.5px}
.btn.danger{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-brouillon{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.s-envoye{background:var(--warn-soft);color:var(--warn)}
.s-accepte{background:var(--ok-soft);color:var(--ok)}
.s-refuse{background:var(--bad-soft);color:var(--bad)}

/* Fields */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.lbl{font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;min-height:42px}
.inp::placeholder{color:var(--muted);opacity:.75}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:620px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .cnt{margin-left:6px;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 6px;font-weight:600;font-size:14px;border-left:1px solid var(--line-strong)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Chantier list */
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:16px;color:var(--muted);font-size:14px}
.stats strong{color:var(--ink);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.filters .inp{max-width:300px;min-height:38px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ch-card{text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .15s, box-shadow .15s}
.ch-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.ch-card .r1,.ch-card .r3{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ch-card .num{font-size:12.5px;color:var(--muted)}
.ch-title{font-family:var(--f-display);font-stretch:106%;font-weight:700;font-size:17px;line-height:1.25}
.ch-meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.ch-card .r3{margin-top:6px;padding-top:9px;border-top:1px dashed var(--line)}
.ch-card .when{font-size:13.5px;color:var(--muted)}
.ch-card .amt{font-weight:700;font-variant-numeric:tabular-nums}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:28px 22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:640px}
.empty h2{font-family:var(--f-display);font-stretch:110%;font-weight:700;font-size:19px}

/* Editor */
.ed-head{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:16px}
.ed-head .grow{flex:1;min-width:180px}
.ed-head .num{font-size:13px;color:var(--muted)}
.ed-head h1{font-family:var(--f-display);font-stretch:110%;font-weight:800;font-size:clamp(21px,3.4vw,26px);line-height:1.15;overflow-wrap:anywhere}
.ed-head .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ed-head select.inp{width:auto;min-height:36px;padding:6px 10px;font-size:14px;font-weight:600}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.ed-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px)}
@media (max-width:979px){.ed-grid{grid-template-columns:minmax(0,1fr)}.ed-side{position:static}.has-bar .main{padding-bottom:120px}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sec{padding:20px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec-h{font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h .aside{font-family:var(--f-body);font-stretch:100%;font-size:13.5px;font-weight:500;color:var(--muted)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.check{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:8px;cursor:pointer}
.check:hover{background:var(--surface-2)}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.base{background:var(--surface-2);color:var(--muted)}
.calc{font-family:var(--f-mono);font-size:14px;padding:12px 14px;border:1.5px dashed var(--line-strong);border-radius:10px;background:var(--surface-2);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.calc .op{color:var(--accent);font-weight:600}
.calc strong{font-weight:600}
.calc .note{font-family:var(--f-body);font-size:12.5px;color:var(--muted);flex-basis:100%;margin-top:2px}
.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.file .th{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;color:var(--muted);font-size:13px}
.file .th img{width:100%;height:100%;object-fit:cover;display:block}
.file .fn{padding:7px 9px 2px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fa{display:flex;justify-content:space-between;align-items:center;padding:2px 5px 6px 9px;font-size:12.5px}
.file .fa a{color:var(--accent);font-weight:600}
.file .fa button{border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px}
.file .fa button.arm{color:var(--bad);font-weight:600}
.ai{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.ai dt{color:var(--muted)} .ai dd{margin:0;font-weight:600}
.ai .obs{font-size:14px}
.team-sum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.team-sum strong{color:var(--ink)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.day{font-size:13px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.warn-box{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:9px 12px;font-size:13.5px}
.lines{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 92px 96px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.mrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.mrow .inp{min-height:38px;padding:6px 9px;text-align:right}
.mrow .tt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.xbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.xbtn:hover{color:var(--bad);border-color:var(--bad)}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 104px 96px 34px;gap:8px;align-items:center}
.xrow .inp{min-height:38px;padding:6px 9px}
@media (max-width:620px){
  .mrow{grid-template-columns:minmax(0,1fr) 80px 34px}
  .mrow .tt{grid-column:1/3;text-align:left;font-weight:500;color:var(--muted);margin-top:-4px}
  .xrow{grid-template-columns:repeat(3,minmax(0,1fr)) 34px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .xrow .x-l{grid-column:1/-1}
}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.file-btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.file-btn.is-disabled{opacity:.5;cursor:not-allowed}
.drop .btns{display:flex;gap:8px;flex-wrap:wrap}
.sec.quick{background:color-mix(in srgb,var(--accent) 5%,var(--surface));border-radius:14px 14px 0 0}
textarea.inp.brief{min-height:130px}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.crew-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 10px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.crew-l{min-width:0}
.crew-l small{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;flex:none}
.stepper button{width:40px;height:38px;border:0;background:var(--surface-2);font-size:20px;line-height:1;color:var(--ink)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.calc-btn{min-height:52px;font-size:17px}
.result{border:1px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.result.partial{border-color:var(--warn);background:var(--warn-soft)}
.ed-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.exec.on{background:color-mix(in srgb,var(--ok) 5%,var(--surface))}
.exec-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left}
.exec-h .sec-h{flex:1}
.exec .subh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:8px}
.exec .subh .aside{font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:500}
.units{display:flex;flex-direction:column;gap:10px}
.unit{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:9px;background:var(--surface)}
.unit-h{display:flex;flex-direction:column;gap:2px}
.chip.busy{border-style:dashed;color:var(--muted)}
.chip.busy .cnt{color:var(--bad)}
.inp.np{flex:1;min-width:170px;min-height:36px;padding:6px 10px}
.ok-t{color:var(--ok);font-weight:600}
.av-list{display:flex;flex-direction:column;gap:6px}
.av{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,320px);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.av-l{display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.seg.av-seg{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg.av-seg button{font-size:12.5px;padding:7px 2px}
.seg button:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:620px){.av{grid-template-columns:minmax(0,1fr)}}
.fact-list{display:flex;flex-direction:column;gap:8px}
.fact{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.fact-l{display:flex;flex-direction:column;gap:1px;min-width:0}
.fact-l .num{font-size:12.5px;color:var(--muted)}
.fact-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.assist{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;overflow:hidden}
.assist-h{width:100%;display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:0;padding:12px 16px;text-align:left}
.assist-t{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:17px;flex:1}
.chev{font-size:22px;line-height:1;color:var(--accent);font-weight:700}
.assist-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.assist-info{display:flex;flex-direction:column;gap:8px;font-size:14px;padding:12px 14px;border-radius:10px;background:var(--surface-2)}

.lexique summary{cursor:pointer;font-weight:600;color:var(--accent)}

.lexique dd{margin:0;color:var(--muted)}
@media (max-width:520px){.lexique dl{grid-template-columns:minmax(0,1fr)}.lexique dd{margin-bottom:6px}.steps li{grid-template-columns:26px minmax(0,1fr)}.steps li .btn{grid-column:2;justify-self:start}}

.tc{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 12px}

.team-res span{color:var(--muted)}
.p-team{display:flex;flex-direction:column;gap:2px;font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}

.file .fa button.open{color:var(--accent);font-weight:600;padding-left:0}

.addrow select{flex:1;min-width:180px}
.subh{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* Devis paper */
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:14px;position:relative}

.p-line .q{display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.p-tots{display:flex;flex-direction:column;gap:4px;font-size:14px}

.group-h{font-family:var(--f-display);font-stretch:110%;font-weight:700;font-size:16px;margin:14px 0 2px}

.pl-grid{display:grid;min-width:max-content}
.pl-grid > div{border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.pl-corner,.pl-day{padding:10px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
.pl-day.today{color:var(--accent)}
.pl-corner,.pl-who{position:sticky;left:0;z-index:1;border-left:0!important}
.pl-corner{background:var(--surface-2)}
.pl-who{background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pl-who span{font-size:12.5px;color:var(--muted)}
.pl-who.none strong{color:var(--warn)}
.pl-cell{padding:6px;display:flex;flex-direction:column;gap:5px;min-height:64px;position:relative}
.pl-cell.today{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.pl-cell.conflict{outline:2px solid var(--bad);outline-offset:-2px}
.pl-flag{align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:1px 7px;border-radius:5px}
.blk{--cc:var(--c1);text-align:left;border:1px solid color-mix(in srgb,var(--cc) 45%,transparent);background:color-mix(in srgb,var(--cc) 14%,var(--surface));border-radius:7px;padding:5px 7px;display:flex;flex-direction:column;gap:1px;font-size:12.5px;max-width:190px}
.blk.prov{border-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--cc) 12%,var(--surface)) 0 6px,var(--surface) 6px 12px)}
.blk.c0{--cc:var(--c1)} .blk.c1{--cc:var(--c2)} .blk.c2{--cc:var(--c3)} .blk.c3{--cc:var(--c4)} .blk.c4{--cc:var(--c5)} .blk.c5{--cc:var(--c6)}
.blk-n{font-family:var(--f-mono);font-weight:600;font-size:11.5px;display:flex;align-items:center;gap:5px}
.blk-n::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--cc);flex:none}
.blk-t{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.blk-h{color:var(--muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:12px;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface-2)}
.sw.prov{border-style:dashed;background:repeating-linear-gradient(135deg,var(--accent-soft) 0 4px,var(--surface) 4px 8px)}
.sw.cf{border:2px solid var(--bad);background:var(--surface)}

/* Réglages */
.set-sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.logo-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-box .th{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.logo-box .th img{object-fit:contain;padding:6px}
.coefs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 16px}
.coef{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:14px}
.coef .inp{min-height:38px;padding:6px 9px;text-align:right}
.switch{display:flex;align-items:center;gap:10px;font-weight:500}
.switch input{width:18px;height:18px;accent-color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 108px);z-index:40;max-width:min(520px,calc(100vw - 32px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:var(--surface)}
.loading{color:var(--muted);padding:30px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/*CORE-START*/
const PRESTATIONS = [
  { id: 'depoussierage', label: 'Dépoussiérage complet : murs, plinthes, prises, radiateurs', base: true },

  { id: 'dechets', label: 'Évacuation des déchets légers et emballages' },
  { id: 'communs', label: 'Escaliers, halls et parties communes' }

const PRESTA_BY_ID = Object.fromEntries(PRESTATIONS.map(p => [p.id, p]));
const TYPES = [

  { id: 'industriel', label: 'Industriel' }, { id: 'ecole', label: 'École / public' }

const DEFAULT_CFG = {

  franchise: false, assurance: '', cadencesOk: false,
  tauxTVA: '20', validite: '30', heuresParJour: '7', samedi: false, tauxDefaut: '38',

  conditions: "Prix établis sur la base des informations et photos transmises. L'accès au chantier, l'eau et l'électricité sont mis à disposition par le client. Toute prestation non prévue fera l'objet d'un avenant. Acompte de 30 % à la commande, solde à la fin de l'intervention, payable à 30 jours. Clients professionnels : en cas de retard de paiement, pénalités égales à trois fois le taux d'intérêt légal et indemnité forfaitaire de 40 € pour frais de recouvrement."
};
const TVA_OPTIONS = [{ v: '20', l: '20 %' }, { v: '10', l: '10 %' }, { v: '5.5', l: '5,5 %' }, { v: '0', l: '0 % – autoliquidation' }];

  { id: 'particulier', label: 'Particulier', hint: 'Une personne pour son logement' },

const MENTION_AUTOLIQ = 'Autoliquidation – TVA due par le preneur (article 283-2 nonies du CGI).';
const MENTION_FRANCHISE = 'TVA non applicable, article 293 B du CGI.';
/* Règle de TVA française appliquée automatiquement */
function tvaRule(ch, cfg) {
  const normal = num(cfg.tauxTVA) || 20;
  if (String(ch.tva ?? '') !== '') {
    const r = num(ch.tva);
    return { rate: r, mode: 'manuel', label: 'TVA ' + fmtQ(r) + ' %', mention: r === 0 ? (cfg.franchise ? MENTION_FRANCHISE : MENTION_AUTOLIQ) : '',
      why: 'Taux choisi à la main.' };

function num(v) { const n = parseFloat(String(v ?? '').replace(',', '.').replace(/\s/g, '')); return isFinite(n) ? n : 0; }
function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function fmtNum(n, d) {
  d = d ?? 2;
  const v = Math.round((+n || 0) * Math.pow(10, d)) / Math.pow(10, d);
  const neg = v < 0;

  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '-' : '') + i + (d > 0 ? ',' + f : '');
}
function eur(n) { return fmtNum(n, 2) + ' €'; }
function fmtQ(n) {
  const r = Math.round((+n || 0) * 100) / 100;
  if (Number.isInteger(r)) return fmtNum(r, 0);
  return fmtNum(r, Math.round(r * 10) === r * 10 ? 1 : 2);
}
function fmtH(n) { return fmtQ(Math.round((+n || 0) * 10) / 10) + ' h'; }
function pad(n) { return String(n).padStart(2, '0'); }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseIso(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function addDays(d, n) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
function isWorkday(d, samedi) { const w = d.getDay(); return w !== 0 && (w !== 6 || !!samedi); }
function fmtDay(s) { return parseIso(s).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }); }
function fmtLong(s) { return parseIso(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); }
function fmtRange(a, b) {
  const withY = a.slice(0, 4) !== b.slice(0, 4) || a.slice(0, 4) !== String(new Date().getFullYear());
  const f = s => fmtDay(s) + (withY ? ' ' + s.slice(0, 4) : '');
  return a === b ? 'le ' + f(a) : 'du ' + f(a) + ' au ' + f(b);
}
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));

function colorIdx(id) { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 6; }
function labelOf(list, id) { const x = list.find(i => i.id === id); return x ? x.label : ''; }

function mergeCfg(raw) {
  const r = raw || {};
  const c = Object.assign({}, DEFAULT_CFG, r);
  c.cadences = Object.assign({}, DEFAULT_CFG.cadences, r.cadences || {});
  c.coefs = Object.assign({}, DEFAULT_CFG.coefs, r.coefs || {});
  c.tauxPostes = Object.assign({}, DEFAULT_CFG.tauxPostes, r.tauxPostes || {});
  delete c.id;
  return c;
}

/* Équipe : composition automatique (1 chef d'équipe à partir de 3 personnes, puis 1 par groupe de ratioChef) */
function composeTeam(people, cfg) {
  const ratio = Math.max(2, Math.round(num(cfg.ratioChef)) || 6);
  const chefs = people >= 3 ? Math.max(1, Math.round(people / ratio)) : 0;
  return [{ role: 'chef', nb: chefs }, { role: 'agent', nb: people - chefs }].filter(b => b.nb > 0);
}
function teamLabel(besoins) {
  return besoins.map(b => b.nb + ' ' + (b.nb > 1 ? ROLE_BY_ID[b.role].plural : ROLE_BY_ID[b.role].label.toLowerCase())).join(' + ');
}
function blendedRate(besoins, cfg) {
  const n = besoins.reduce((s, b) => s + b.nb, 0);
  return n ? besoins.reduce((s, b) => s + b.nb * (num(cfg.tauxPostes[b.role]) || num(cfg.tauxDefaut)), 0) / n : num(cfg.tauxDefaut);
}

function compute(ch, cfg, employes, materiel) {
  const cad = num(cfg.cadences[ch.salissure]) || 25;
  const presta = ch.prestations || [];
  const coefPct = presta.reduce((s, id) => s + (PRESTA_BY_ID[id] && !PRESTA_BY_ID[id].base ? num(cfg.coefs[id]) : 0), 0);
  const hpd = Math.max(1, num(cfg.heuresParJour) || 7);
  const delaiDefaut = Math.max(1, Math.round(num(ch.delai)) || Math.round(num(cfg.delaiDefaut)) || 5);
  const zoneRows = (ch.zones || []).filter(z => num(z.surface) > 0).map(z => {
    const sal = SALISSURES.some(s => s.id === z.salissure) ? z.salissure : (ch.salissure || 'normal');
    const cz = num(cfg.cadences[sal]) || 25;
    const h = Math.ceil(num(z.surface) / cz * (1 + coefPct / 100) * 2 - 1e-9) / 2;
    return { k: z.k, nom: z.nom || 'Zone', surface: num(z.surface), salissure: sal, date: z.date || '', periode: z.periode || '', cad: cz, h, hEff: h, delai: Math.max(1, Math.round(num(z.delai)) || delaiDefaut) };
  });
  const surface = zoneRows.length ? zoneRows.reduce((s, z) => s + z.surface, 0) : num(ch.surface);
  const auto = zoneRows.length ? zoneRows.reduce((s, z) => s + z.h, 0) : (surface > 0 ? surface / cad * (1 + coefPct / 100) : 0);
  const autoRounded = zoneRows.length ? auto : Math.ceil(auto * 2 - 1e-9) / 2;
  const manual = String(ch.heuresManuel ?? '').trim() !== '';
  const hours = manual ? Math.max(0, num(ch.heuresManuel)) : autoRounded;
  const factor = zoneRows.length && autoRounded > 0 ? hours / autoRounded : 1;
  zoneRows.forEach(z => { z.hEff = z.h * factor; });

  // Mode d'équipe : « auto » = l'app calcule le nombre de personnes à partir du délai ; « manuel » = équipe choisie
  const team = (ch.equipe || []).map(id => employes[id]).filter(Boolean);
  const manualBesoins = (ch.besoins || []).filter(b => ROLE_BY_ID[b.role] && Math.round(num(b.nb)) > 0).map(b => ({ role: b.role, nb: Math.round(num(b.nb)) }));
  const modeEquipe = ch.modeEquipe === 'auto' || ch.modeEquipe === 'manuel' ? ch.modeEquipe : (manualBesoins.length || team.length ? 'manuel' : 'auto');
  const fixedN = manualBesoins.length ? manualBesoins.reduce((s, b) => s + b.nb, 0) : Math.max(team.length, 1);
  const fixedRate = manualBesoins.length ? blendedRate(manualBesoins, cfg)
    : team.length ? team.reduce((s, e) => s + (num(e.taux) || num(cfg.tauxDefaut)), 0) / team.length : num(cfg.tauxDefaut);

  // Organisation : pour chaque bloc de travail, personnes nécessaires, heures et jours
  const blocks = zoneRows.length ? zoneRows.map(z => ({ nom: z.nom, surface: z.surface, h: z.hEff, delai: z.delai, date: z.date, periode: z.periode, k: z.k }))
    : (hours > 0 ? [{ nom: ch.titre || 'Chantier', surface, h: hours, delai: delaiDefaut, date: ch.dateDebut || '', periode: '', k: '_main' }] : []);
  const org = blocks.map(b => {
    let people, besoins, rate;
    if (modeEquipe === 'auto') {
      people = Math.max(1, Math.ceil(b.h / (b.delai * hpd) - 1e-9));
      besoins = composeTeam(people, cfg); rate = blendedRate(besoins, cfg);
    } else {
      people = fixedN; besoins = manualBesoins.length ? manualBesoins : []; rate = fixedRate;
    }
    const perPerson = b.h / people;
    const days = b.h > 0 ? Math.ceil(perPerson / hpd - 1e-9) : 0;
    return Object.assign({}, b, { people, besoins, rate, perPerson, days, label: besoins.length ? teamLabel(besoins) : people + (people > 1 ? ' personnes' : ' personne'), cost: round2(b.h * rate) });
  });
  const maxPeople = org.reduce((m, o) => Math.max(m, o.people), 0);
  const minPeople = org.reduce((m, o) => Math.min(m, o.people), Infinity);
  const n = org.length ? maxPeople : fixedN;
  const rate = hours > 0 && org.length ? org.reduce((s, o) => s + o.cost, 0) / hours : fixedRate;
  const main = org.length === 1 ? org[0] : null;
  const besoins = main ? main.besoins : (modeEquipe === 'manuel' ? manualBesoins : []);
  const perEmp = main ? main.perPerson : (n ? hours / n : 0);
  const days = org.reduce((s, o) => s + o.days, 0);
  const crewLabel = !org.length ? (manualBesoins.length ? teamLabel(manualBesoins) : '—')
    : main ? main.label + (main.people >= 2 && main.besoins.length > 1 ? ' (' + main.people + ' personnes)' : '')
    : minPeople === maxPeople ? org[0].label + ' (' + maxPeople + (maxPeople > 1 ? ' personnes' : ' personne') + ')'
    : 'de ' + minPeople + ' à ' + maxPeople + ' personnes selon la phase';
  const crew = team.length && modeEquipe === 'manuel' ? team.map(e => e.nom || 'Agent')
    : besoins.length ? besoins.flatMap(b => Array.from({ length: b.nb }, (_, i) => ROLE_BY_ID[b.role].label + (b.nb > 1 ? ' ' + (i + 1) : '')))
    : Array.from({ length: Math.max(1, n) }, (_, i) => 'Personne ' + (i + 1));

  const lines = [];
  if (hours > 0 && zoneRows.length) {
    org.forEach(o => lines.push({ cat: 'zone', key: 'z:' + o.k, label: o.nom + ' · ' + fmtNum(o.surface, 0) + ' m²' + (o.periode ? ' · ' + o.periode : ''), qte: 1, unite: 'forfait', pu: o.cost,
      note: fmtH(o.h) + ' de travail · ' + o.people + (o.people > 1 ? ' personnes' : ' personne') + ' · ' + o.days + (o.days > 1 ? ' jours' : ' jour') }));
  } else if (hours > 0) {
    if (besoins.length) {
      besoins.forEach(b => lines.push({ cat: 'mo', key: 'mo:' + b.role, label: "Main-d'œuvre – " + ROLE_BY_ID[b.role].label + (b.nb > 1 ? ' × ' + b.nb : ''), qte: round2(perEmp * b.nb), unite: 'h', pu: num(cfg.tauxPostes[b.role]) || num(cfg.tauxDefaut) }));
    } else if (team.length) {
      team.forEach(e => lines.push({ cat: 'mo', key: 'mo:' + e.id, label: "Main-d'œuvre – " + (e.nom || 'Agent') + (e.poste ? ' (' + e.poste + ')' : ''), qte: round2(perEmp), unite: 'h', pu: num(e.taux) || num(cfg.tauxDefaut) }));
    } else {
      lines.push({ cat: 'mo', key: 'mo', label: "Main-d'œuvre", qte: hours, unite: 'h', pu: num(cfg.tauxDefaut) });
    }
  }
  const dayCount = org.length && !zoneRows.length ? days : days;
  (ch.materiel || []).forEach(row => {
    const m = materiel[row.id]; if (!m) return;
    const q = num(row.qte); if (q <= 0) return;
    if (m.unite === 'jour') {
      if (dayCount <= 0) return;
      lines.push({ cat: 'mat', key: 'm:' + row.id, label: (m.nom || 'Matériel') + ' – ' + fmtQ(q) + ' × ' + dayCount + ' j', qte: q * dayCount, unite: 'jour', pu: num(m.prix) });
    } else {
      lines.push({ cat: 'mat', key: 'm:' + row.id, label: m.nom || 'Matériel', qte: q, unite: UNIT_SHORT[m.unite] || 'pce', pu: num(m.prix) });
    }
  });
  (ch.extras || []).forEach((x, xi) => {
    if (!String(x.label || '').trim()) return;
    lines.push({ cat: 'extra', key: 'x:' + (x.k || xi), label: x.label.trim(), qte: num(x.qte) || 1, unite: x.unite || 'forfait', pu: num(x.pu), inclus: !(num(x.pu) > 0) });
  });
  if (num(ch.deplacement) > 0) lines.push({ cat: 'dep', key: 'dep', label: 'Déplacement et installation de chantier', qte: 1, unite: 'forfait', pu: num(ch.deplacement) });
  lines.forEach(l => { l.total = round2(l.qte * l.pu); });
  const subtotal = round2(lines.reduce((s, l) => s + l.total, 0));
  const remisePct = Math.min(100, Math.max(0, num(ch.remise)));
  const remise = round2(subtotal * remisePct / 100);
  const ht = round2(subtotal - remise);
  const rule = tvaRule(ch, cfg);
  const tvaRate = rule.rate;
  const tva = round2(ht * tvaRate / 100);
  const ttc = round2(ht + tva);
  const autoliq = !!rule.mention;
  const ttcLabel = tvaRate === 0 && rule.mention ? 'Total net à payer' : 'Total TTC';
  return { surface, cad, coefPct, auto, autoRounded, manual, hours, zoneRows, org, modeEquipe, delaiDefaut, maxPeople, minPeople: org.length ? minPeople : 0, rate, team, besoins, crew, crewLabel, n, hpd, perEmp, days, lines, subtotal, remisePct, remise, ht, tvaRate, tva, ttc, autoliq, rule, ttcLabel };
}

/* Planning : chaque bloc (chantier ou zone) occupe ses jours ouvrés, avec son nombre de personnes */
function schedule(ch, comp, cfg) {
  if (!(comp.hours > 0) || !comp.org.length) return [];
  const byDate = new Map();
  const lastEnd = new Map(); // un même bâtiment : les phases se suivent, jamais en même temps
  let cursor = ch.dateDebut ? parseIso(ch.dateDebut) : null;
  for (const o of comp.org) {
    let d = o.date ? parseIso(o.date) : cursor;
    if (!d) continue;
    const parts = String(o.nom).split(' – ');
    const key = (parts.length > 1 ? parts.slice(1).join(' – ') : '').trim().toLowerCase();
    if (key && lastEnd.has(key) && d <= lastEnd.get(key)) d = addDays(lastEnd.get(key), 1);
    let rem = o.perPerson, guard = 0, last = d;
    while (rem > 1e-6 && guard++ < 1500) {
      if (isWorkday(d, cfg.samedi)) {
        const h = Math.min(comp.hpd, rem); rem -= h; last = d;
        const k = iso(d), cur = byDate.get(k) || { date: k, h: 0, people: 0, items: [] };
        cur.h = Math.max(cur.h, Math.round(h * 100) / 100); cur.people += o.people; cur.items.push({ k: o.k, nom: o.nom, people: o.people, h: Math.round(h * 100) / 100 });
        byDate.set(k, cur);
      }
      d = addDays(d, 1);
    }
    if (key) lastEnd.set(key, last);
    if (!o.date || !cursor || d > cursor) cursor = d;
  }
  return [...byDate.values()].sort((a, b) => (a.date < b.date ? -1 : 1));
}

function buildBookings(chantiers, cfg, employes, materiel) {
  const byEmp = {}, sansEquipe = {};
  Object.values(chantiers).forEach(ch => {
    if (ch.statut === 'refuse' || !ch.dateDebut) return;
    const comp = compute(ch, cfg, employes, materiel);
    const sched = schedule(ch, comp, cfg);
    sched.forEach(s => s.items.forEach(it => {
      const ids = assignedTo(ch, it.k).filter(id => employes[id]);
      ids.forEach(id => { ((byEmp[id] = byEmp[id] || {})[s.date] = byEmp[id][s.date] || []).push({ ch, h: it.h, k: it.k, nom: it.nom }); });
      const reste = Math.max(0, it.people - ids.length);
      if (reste) (sansEquipe[s.date] = sansEquipe[s.date] || []).push({ ch, h: it.h, people: reste, k: it.k });
    }));
  });
  return { byEmp, sansEquipe };
}
/* Personnes nommées sur une phase (ou, pour les anciens devis, l'équipe du chantier) */
function assignedTo(ch, k) {
  const t = ch.travaux && ch.travaux[k];
  if (t && Array.isArray(t.equipe)) return t.equipe;
  return ch.modeEquipe === 'manuel' || (!ch.modeEquipe && (ch.equipe || []).length) ? (ch.equipe || []) : [];
}

/* ---------- TVA expliquée ---------- */
function tvaText(rule, base, cfg) {
  const normal = num(cfg.tauxTVA) || 20;
  if (rule.mode === 'normal') return 'TVA française au taux normal de ' + fmtQ(rule.rate) + ' % (article 278 du CGI), calculée sur le montant hors taxes de ' + eur(base) + ', soit ' + eur(round2(base * rule.rate / 100)) + '.';
  if (rule.mode === 'reduit') return 'TVA au taux intermédiaire de 10 % (article 279-0 bis du CGI) : travaux dans un logement à usage d’habitation achevé depuis plus de 2 ans. En signant, le client confirme que ces conditions sont remplies.';
  if (rule.mode === 'autoliq') return 'Autoliquidation (article 283-2 nonies du CGI) : prestation réalisée en sous-traitance pour une entreprise du bâtiment. Le montant est facturé hors taxes ; la TVA est déclarée et payée par le donneur d’ordre. Pour information, au taux de ' + fmtQ(normal) + ' %, elle représente ' + eur(round2(base * normal / 100)) + '.';
  if (rule.mode === 'franchise') return 'TVA non applicable, article 293 B du CGI : notre entreprise bénéficie de la franchise en base de TVA. Le montant à payer est le montant hors taxes.';
  return 'TVA appliquée au taux de ' + fmtQ(rule.rate) + ' %' + (rule.mention ? '. ' + rule.mention : '.');
}

/* ---------- Facturation : acompte et situations de travaux ---------- */
function billing(ch, comp) {
  const rem = 1 - comp.remisePct / 100;
  const factures = ch.factures || [];
  const done = {};
  let acompteHT = 0, acompteDeduit = 0, travauxFactures = 0;
  factures.forEach(f => {
    if (f.type === 'acompte') acompteHT += f.netHT;
    else { (f.lignes || []).forEach(x => { done[x.key] = Math.max(done[x.key] || 0, x.pctCumul); }); acompteDeduit += f.deductionAcompte || 0; travauxFactures += f.ht || 0; }
  });
  const av = ch.avancement || {};
  const rows = comp.lines.filter(l => !l.inclus && l.total > 0).map(l => {
    const montant = round2(l.total * rem);
    const pct = Math.min(100, Math.max(0, num(av[l.key])));
    const deja = done[l.key] || 0;
    return { key: l.key, label: l.label, cat: l.cat, montant, pct, deja, aFacturer: pct > deja ? round2(montant * (pct - deja) / 100) : 0 };
  });
  const allDone = rows.length > 0 && rows.every(r => r.pct >= 100);
  let situationHT = round2(rows.reduce((s, r) => s + r.aFacturer, 0));
  if (allDone && situationHT > 0) situationHT = round2(comp.ht - travauxFactures);
  const resteAcompte = round2(acompteHT - acompteDeduit);
  let deduction = comp.ht > 0 ? round2(acompteHT * situationHT / comp.ht) : 0;
  if (allDone) deduction = resteAcompte;
  deduction = Math.max(0, Math.min(deduction, resteAcompte, situationHT));
  return {
    rows, allDone, situationHT, deduction, netHT: round2(situationHT - deduction),
    acompteHT: round2(acompteHT), resteAcompte, travauxFactures: round2(travauxFactures),
    realiseHT: round2(rows.reduce((s, r) => s + r.montant * r.pct / 100, 0)), hasAcompte: factures.some(f => f.type === 'acompte')
  };
}
function nextFactureNumero(chantiers) {
  const y = new Date().getFullYear(); const re = new RegExp('^F-' + y + '-(\\d+)$'); let max = 0;
  Object.values(chantiers).forEach(c => (c.factures || []).forEach(f => { const m = re.exec(f.numero || ''); if (m) max = Math.max(max, +m[1]); }));
  return 'F-' + y + '-' + String(max + 1).padStart(3, '0');
}
function makeFacture(type, ch, comp, cfg, numero) {
  const today = iso(new Date());
  const delai = Math.round(num(cfg.delaiPaiement)) || 30;
  let f;
  if (type === 'acompte') {
    const pct = num(cfg.acomptePct) || 30;
    const netHT = round2(comp.ht * pct / 100);
    f = { type, pct, ht: netHT, deductionAcompte: 0, netHT, lignes: [] };
  } else {
    const b = billing(ch, comp);
    f = { type: 'situation', situation: (ch.factures || []).filter(x => x.type === 'situation').length + 1, ht: b.situationHT, deductionAcompte: b.deduction, netHT: b.netHT,
      realiseHT: b.realiseHT, dejaFactureHT: b.travauxFactures, solde: b.allDone,
      lignes: b.rows.filter(r => r.pct > 0).map(r => ({ key: r.key, label: r.label, montant: r.montant, pctCumul: r.pct, deja: r.deja, aFacturer: r.aFacturer })) };
  }
  const tva = round2(f.netHT * comp.rule.rate / 100);
  return Object.assign(f, { id: rid(), numero, date: today, echeance: iso(addDays(parseIso(today), delai)), devis: ch.numero, totalDevisHT: comp.ht,
    tvaRate: comp.rule.rate, tvaMode: comp.rule.mode, tvaLabel: comp.rule.label, mention: comp.rule.mention, tvaInfo: tvaText(comp.rule, f.netHT, cfg),
    tva, ttc: round2(f.netHT + tva), ttcLabel: comp.rule.rate === 0 && comp.rule.mention ? 'Net à payer' : 'Total TTC à payer', paye: false });
}

const PDF_C = { acc: [29, 91, 214], ink: [21, 32, 44], mut: [90, 102, 118], line: [214, 220, 228], soft: [243, 245, 248] };
const CHIP_RGB = [[29, 91, 214], [192, 86, 26], [20, 128, 107], [135, 70, 181], [165, 122, 18], [190, 58, 107]];

function T(s) {
  return String(s ?? '').replace(/[   ]/g, ' ').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/−/g, '-');
}

  coLines.forEach((l, i) => doc.text(T(l), tx, y + 10.5 + i * 4));
  doc.setFont('helvetica', 'bold'); doc.setFontSize(24); doc.setTextColor(...C.acc);
  doc.text('DEVIS', W - M, y + 7, { align: 'right' });
  doc.setFontSize(10); doc.setTextColor(...C.ink);

  const sal = labelOf(SALISSURES, ch.salissure);
  const nDays = sched.length || comp.days;

  const L2 = boxLines([
    { t: ch.titre || ch.adresse || 'Chantier', b: true }, { t: ch.titre ? ch.adresse : '' },
    { t: [labelOf(TYPES, ch.type), comp.surface ? fmtNum(comp.surface, 0) + ' m²' : '', sal ? 'salissure ' + sal.toLowerCase() : ''].filter(Boolean).join(' · ') },
    { t: when }, { t: dur ? 'Durée estimée : ' + dur : '' }, { t: comp.org.length ? 'Équipe : ' + comp.crewLabel : '' }
  ]);
  const bh = 12 + Math.max(L1.length, L2.length) * 4.4 + 2;
  [[M, 'CLIENT', L1], [M + bw + 6, 'CHANTIER', L2]].forEach(([x, title, ls]) => {
    doc.setDrawColor(...C.line); doc.setLineWidth(0.3); doc.roundedRect(x, y, bw, bh, 2, 2);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...C.mut); doc.text(title, x + 4, y + 6, { charSpace: 0.4 });
    doc.setFontSize(9.5); doc.setTextColor(...C.ink);
    ls.forEach((l, i) => { doc.setFont('helvetica', l.b ? 'bold' : 'normal'); doc.text(l.t, x + 4, y + 12 + i * 4.4); });
  });
  y += bh + 8;

  // Prestations
  const presta = PRESTATIONS.filter(p => (ch.prestations || []).includes(p.id));
  if (presta.length) {
    heading('Prestations incluses');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    const colW = (CW - 6) / 2, half = Math.ceil(presta.length / 2);
    const cols = [y, y];
    presta.forEach((p, i) => {
      const c = i < half ? 0 : 1, x = M + c * (colW + 6);
      const parts = doc.splitTextToSize(T(p.label), colW - 5);
      doc.setTextColor(...C.acc); doc.text('•', x, cols[c]);
      doc.setTextColor(...C.ink); doc.text(parts, x + 4, cols[c]);
      cols[c] += parts.length * 4 + 1.3;
    });
    y = Math.max(cols[0], cols[1]) + 4;
  }
  // Équipe et temps de travail
  if (comp.org.length && comp.hours > 0) {
    heading('Équipe et temps de travail');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...C.ink);
    if (comp.org.length === 1) {
      const o = comp.org[0];
      const rows = [
        ['Personnes nécessaires', o.people + (o.people > 1 ? ' personnes' : ' personne') + (o.besoins.length ? ' : ' + o.label : '')],
        ['Temps de travail', fmtH(o.h) + ' au total, soit ' + fmtH(o.perPerson) + ' par personne'],
        ['Durée', o.days + (o.days > 1 ? ' jours ouvrés' : ' jour ouvré') + ' à ' + fmtQ(comp.hpd) + ' h par jour']
      ];
      rows.forEach(([k, v]) => { ensure(6); doc.setTextColor(...C.mut); doc.text(T(k), M, y); doc.setTextColor(...C.ink); doc.text(doc.splitTextToSize(T(v), CW - 52), M + 50, y); y += 5.2; });
      y += 3;
    } else {
      const oc = [{ h: 'Bâtiment, zone ou phase', w: 92, a: 'left' }, { h: 'Surface', w: 22, a: 'right' }, { h: 'Heures', w: 22, a: 'right' }, { h: 'Personnes', w: 22, a: 'right' }, { h: 'Jours', w: 20, a: 'right' }];
      const oh = () => {
        doc.setFillColor(...C.soft); doc.rect(M, y - 4.5, CW, 6.5, 'F');
        doc.setFont('helvetica', 'bold'); doc.setFontSize(7.8); doc.setTextColor(...C.mut);
        let x = M; oc.forEach(c => { doc.text(c.h, c.a === 'right' ? x + c.w - 2 : x + 2, y, { align: c.a }); x += c.w; }); y += 5.5;
      };
      ensure(14); oh();
      comp.org.forEach(o => {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
        const parts = doc.splitTextToSize(T(o.nom + (o.periode ? ' (' + o.periode + ')' : '')), oc[0].w - 4);
        const rh = parts.length * 3.8 + 1.8;
        if (y + rh > H - 24) { doc.addPage(); y = M + 6; oh(); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); }
        let x = M; doc.setTextColor(...C.ink); doc.text(parts, x + 2, y); x += oc[0].w;
        [fmtNum(o.surface, 0) + ' m²', fmtH(o.h), String(o.people), String(o.days)].forEach((v, i) => { doc.text(T(v), x + oc[i + 1].w - 2, y, { align: 'right' }); x += oc[i + 1].w; });
        y += rh;
      });
      doc.setDrawColor(...C.line); doc.line(M, y - 2, W - M, y - 2);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
      doc.text('Total', M + 2, y + 2);
      let x = M + oc[0].w;
      [fmtNum(comp.surface, 0) + ' m²', fmtH(comp.hours), comp.minPeople === comp.maxPeople ? String(comp.maxPeople) : comp.minPeople + ' à ' + comp.maxPeople, String(nDays)].forEach((v, i) => { doc.text(T(v), x + oc[i + 1].w - 2, y + 2, { align: 'right' }); x += oc[i + 1].w; });
      y += 6;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.8); doc.setTextColor(...C.mut);
      doc.text(T('Total des jours : jours ouvrés de présence sur le chantier. Plusieurs bâtiments peuvent être nettoyés le même jour ; les phases d’un même bâtiment se suivent.'), M, y, { maxWidth: CW });
      y += 7;
    }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.8); doc.setTextColor(...C.mut);
    const basis = comp.modeEquipe === 'auto'
      ? 'Nombre de personnes calculé pour finir chaque intervention dans le délai prévu (' + fmtQ(comp.hpd) + ' h de travail par jour et par personne).'
      : 'Temps de travail calculé à partir des surfaces et de nos cadences de nettoyage, réparti sur l’équipe indiquée.';
    const bl = doc.splitTextToSize(T(basis), CW); ensure(bl.length * 3.5 + 3); doc.text(bl, M, y); y += bl.length * 3.5 + 5;
  }
  if (ch.notesClient && String(ch.notesClient).trim()) {
    heading('Remarques');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...C.ink);
    const nl = doc.splitTextToSize(T(ch.notesClient), CW);
    ensure(nl.length * 4 + 4); doc.text(nl, M, y); y += nl.length * 4 + 4;
  }

  // Tableau
  const cols = [
    { h: 'Désignation', w: 84, a: 'left' }, { h: 'Qté', w: 18, a: 'right' }, { h: 'Unité', w: 18, a: 'left' },
    { h: 'P.U. HT', w: 28, a: 'right' }, { h: 'Total HT', w: 30, a: 'right' }
  ];
  const tableHeader = () => {
    doc.setFillColor(...C.soft); doc.rect(M, y, CW, 7.5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...C.mut);
    let x = M;
    cols.forEach(c => { doc.text(c.h, c.a === 'right' ? x + c.w - 2 : x + 2, y + 5, { align: c.a }); x += c.w; });
    y += 7.5;
  };
  heading('Détail du prix');
  ensure(20); tableHeader();
  doc.setFontSize(9);
  comp.lines.forEach(l => {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    const parts = doc.splitTextToSize(T(l.label), cols[0].w - 4);
    const rh = Math.max(7, parts.length * 4 + 3);
    if (y + rh > H - 24) { doc.addPage(); y = M + 4; tableHeader(); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); }
    let x = M; const ty = y + 4.8;
    doc.setTextColor(...C.ink); doc.text(parts, x + 2, ty); x += cols[0].w;
    doc.text(T(fmtQ(l.qte)), x + cols[1].w - 2, ty, { align: 'right' }); x += cols[1].w;
    doc.setTextColor(...C.mut); doc.text(T(l.unite), x + 2, ty); x += cols[2].w;
    doc.setTextColor(...C.ink); doc.text(T(l.inclus ? 'Inclus' : eur(l.pu)), x + cols[3].w - 2, ty, { align: 'right' }); x += cols[3].w;
    doc.text(T(l.inclus ? 'Inclus' : eur(l.total)), x + cols[4].w - 2, ty, { align: 'right' });
    y += rh; doc.setDrawColor(...C.line); doc.setLineWidth(0.2); doc.line(M, y, W - M, y);
  });
  if (!comp.lines.length) { doc.setTextColor(...C.mut); doc.text('Aucune ligne pour le moment.', M + 2, y + 5); y += 8; }

  // Totaux
  y += 6; ensure(42);
  const tx1 = W - M - 76, tx2 = W - M - 3;
  const tot = (label, val, bold) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(9.5);
    doc.setTextColor(...(bold ? C.ink : C.mut)); doc.text(T(label), tx1, y);
    doc.setTextColor(...C.ink); doc.text(T(val), tx2, y, { align: 'right' }); y += 5.6;
  };
  if (comp.remise > 0) { tot('Sous-total HT', eur(comp.subtotal)); tot('Remise ' + fmtQ(comp.remisePct) + ' %', '- ' + eur(comp.remise)); }
  tot('Total HT', eur(comp.ht), true);
  tot(comp.rule.label, comp.rule.mention && comp.tvaRate === 0 ? '-' : eur(comp.tva));
  doc.setFillColor(...C.acc); doc.roundedRect(tx1 - 4, y - 3.5, W - M - (tx1 - 4), 10.5, 1.5, 1.5, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5);
  doc.text(T(comp.ttcLabel), tx1, y + 3.4); doc.text(T(eur(comp.ttc)), tx2, y + 3.4, { align: 'right' });
  y += 13;
  // TVA : quel taux, pourquoi, et combien
  {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.3);
    const tl = doc.splitTextToSize(T(tvaText(comp.rule, comp.ht, cfg)), CW - 8);
    const mh = comp.rule.mention ? 4.4 : 0;
    const bhT = 8 + tl.length * 3.7 + mh + 2;
    ensure(bhT + 4);
    doc.setFillColor(...C.soft); doc.roundedRect(M, y, CW, bhT, 1.5, 1.5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...C.mut); doc.text('TVA', M + 4, y + 5, { charSpace: 0.4 });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.3); doc.setTextColor(...C.ink); doc.text(tl, M + 4, y + 9.5);
    if (comp.rule.mention) { doc.setFont('helvetica', 'bold'); doc.text(T(comp.rule.mention), M + 4, y + 9.5 + tl.length * 3.7 + 0.8); }
    y += bhT + 6;
  }

  // Conditions
  const cond = (cfg.conditions || '') + (cfg.iban ? '\nPaiement par virement sur le compte ' + cfg.iban + ' avec la référence ' + (ch.numero || '') + '.' : '') +
    (cfg.assurance ? '\nAssurance professionnelle : ' + cfg.assurance + '.' : '') + '\nDevis gratuit.';
  if (cond.trim()) {
    heading('Conditions');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...C.mut);
    const lines = doc.splitTextToSize(T(cond), CW);
    ensure(lines.length * 3.8 + 4); doc.text(lines, M, y); y += lines.length * 3.8 + 6;
  }

  // Signatures
  ensure(38);
  doc.setDrawColor(...C.line); doc.setLineWidth(0.3);
  doc.roundedRect(M, y, bw, 32, 2, 2); doc.roundedRect(M + bw + 6, y, bw, 32, 2, 2);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...C.mut);
  doc.text("POUR L'ENTREPRISE", M + 4, y + 6, { charSpace: 0.4 });
  doc.text('BON POUR ACCORD – LE CLIENT', M + bw + 10, y + 6, { charSpace: 0.4 });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...C.ink);
  doc.text(T(cfg.nom || ''), M + 4, y + 11);
  doc.setTextColor(...C.mut);
  doc.text(doc.splitTextToSize(T('Date, nom et signature, précédés de la mention « Bon pour accord »'), bw - 8), M + bw + 10, y + 11);
  y += 38;

  // Planning d'intervention
  if (sched.length) {
    doc.addPage(); y = M + 4;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(...C.ink);
    doc.text("Planning d'intervention", M, y + 2);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...C.mut);
    doc.text(T('Devis ' + (ch.numero || '') + ' · ' + (ch.titre || ch.adresse || '')), M, y + 8);
    doc.text(T(fmtH(comp.hours) + ' au total · ' + nDays + (nDays > 1 ? ' jours ouvrés' : ' jour ouvré') + ' · ' + comp.crewLabel), M, y + 12.5);
    y += 20;
    const pc = [{ h: 'Jour', w: 40, a: 'left' }, { h: 'Travaux', w: 74, a: 'left' }, { h: 'Personnes', w: 20, a: 'right' }, { h: 'H / pers.', w: 22, a: 'right' }, { h: 'Heures', w: 22, a: 'right' }];
    const head = () => {
      doc.setFillColor(...C.soft); doc.rect(M, y, CW, 8, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...C.mut);
      let x = M; pc.forEach(c => { doc.text(c.h, c.a === 'right' ? x + c.w - 2 : x + 2, y + 5.3, { align: c.a }); x += c.w; });
      y += 8;
    };
    head();
    sched.forEach(s => {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
      const work = doc.splitTextToSize(T(s.items.map(it => it.nom + (s.items.length > 1 ? ' (' + it.people + ')' : '')).join(' ; ')), pc[1].w - 3).slice(0, 3);
      const rh = Math.max(7, work.length * 3.8 + 3.2);
      if (y + rh > H - 22) { doc.addPage(); y = M + 4; head(); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); }
      doc.setTextColor(...C.ink);
      const dl = parseIso(s.date).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      let x = M; const ty = y + 4.8;
      doc.text(T(dl), x + 2, ty); x += pc[0].w;
      doc.text(work, x + 2, ty); x += pc[1].w;
      const tot = s.items.reduce((a, it) => a + it.people * it.h, 0);
      [String(s.people), fmtH(s.h), fmtH(tot)].forEach((v, i) => { doc.text(T(v), x + pc[i + 2].w - 2, ty, { align: 'right' }); x += pc[i + 2].w; });
      y += rh; doc.setDrawColor(...C.line); doc.setLineWidth(0.2); doc.line(M, y, W - M, y);
    });
    y += 6;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...C.mut);
    doc.text(doc.splitTextToSize(T('Horaires indicatifs, établis sur ' + fmtQ(comp.hpd) + ' h de travail par jour et par personne. Les dates sont confirmées à la signature du devis.'), CW), M, y);
  }

  // Pied de page
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setDrawColor(...C.line); doc.setLineWidth(0.2); doc.line(M, H - 14, W - M, H - 14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...C.mut);
    doc.text(T([cfg.nom, cfg.siret ? 'SIRET ' + cfg.siret : '', cfg.tva ? 'TVA ' + cfg.tva : '', cfg.iban ? 'IBAN ' + cfg.iban : ''].filter(Boolean).join(' · ')), M, H - 9.5);
    doc.text(T((ch.numero || '') + ' · page ' + i + '/' + pages), W - M, H - 9.5, { align: 'right' });
  }
  return doc;
}

/* En-tête commun (facture, planning d'équipe) */
function pdfHead(doc, cfg, logo, title, rightLines) {
  const W = 210, M = 16, C = PDF_C;
  let y = M, tx = M;
  if (logo) { const h = 16, w = Math.min(38, h * (logo.ratio || 1)); try { doc.addImage(logo.dataUrl, logo.fmt, M, y, w, h); tx = M + w + 5; } catch (e) { tx = M; } }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(...C.ink);
  doc.text(T(cfg.nom || 'Votre entreprise'), tx, y + 5);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...C.mut);
  const co = [cfg.forme, cfg.adresse, [cfg.cpVille, cfg.cpVille ? cfg.pays : ''].filter(Boolean).join(', '), [cfg.tel, cfg.email].filter(Boolean).join(' · '),
    [cfg.siret ? 'SIRET ' + cfg.siret : '', cfg.tva ? 'TVA intracom. ' + cfg.tva : ''].filter(Boolean).join(' · ')].filter(Boolean);
  co.forEach((l, i) => doc.text(T(l), tx, y + 10.5 + i * 4));
  doc.setFont('helvetica', 'bold'); doc.setFontSize(title.length > 12 ? 17 : 22); doc.setTextColor(...C.acc);
  doc.text(T(title), W - M, y + 7, { align: 'right' });
  rightLines.forEach((l, i) => {
    doc.setFont('helvetica', i === 0 ? 'bold' : 'normal'); doc.setFontSize(i === 0 ? 10 : 8.5); doc.setTextColor(...(i === 0 ? C.ink : C.mut));
    doc.text(T(l), W - M, y + 13.5 + (i === 0 ? 0 : 1) + i * 4, { align: 'right' });
  });
  y = Math.max(y + 10.5 + co.length * 4, y + 15 + rightLines.length * 4) + 3;
  doc.setDrawColor(...C.acc); doc.setLineWidth(0.7); doc.line(M, y, W - M, y);
  return y + 6;
}
function pdfFooter(doc, cfg, ref) {
  const W = 210, H = 297, M = 16, C = PDF_C;
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setDrawColor(...C.line); doc.setLineWidth(0.2); doc.line(M, H - 14, W - M, H - 14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(...C.mut);
    doc.text(T([cfg.nom, cfg.forme, cfg.siret ? 'SIRET ' + cfg.siret : '', cfg.iban ? 'IBAN ' + cfg.iban : ''].filter(Boolean).join(' · ')), M, H - 9.5);
    doc.text(T(ref + ' · page ' + i + '/' + pages), W - M, H - 9.5, { align: 'right' });
  }
}

function facturePdf(f, ch, cfg, logo) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 16, CW = W - 2 * M, C = PDF_C;
  const title = f.type === 'acompte' ? "FACTURE D'ACOMPTE" : 'FACTURE';
  let y = pdfHead(doc, cfg, logo, title, ['N° ' + f.numero, 'Date : ' + fmtLong(f.date), 'Échéance : ' + fmtLong(f.echeance)]);
  const ensure = h => { if (y + h > H - 22) { doc.addPage(); y = M + 4; } };
  const bw = (CW - 6) / 2;
  const cl = ch.client || {};
  doc.setFontSize(9.5);
  const box = rows => { const out = []; rows.forEach(r => { if (!r || !r.t) return; doc.setFont('helvetica', r.b ? 'bold' : 'normal'); doc.splitTextToSize(T(r.t), bw - 8).forEach(p => out.push({ t: p, b: r.b })); }); return out; };
  const L1 = box([{ t: cl.nom || 'Client', b: true }, { t: cl.adresse }, { t: cl.siren ? 'SIREN / SIRET : ' + cl.siren : '' }, { t: cl.email }]);
  const L2 = box([{ t: ch.titre || 'Chantier', b: true }, { t: ch.adresse }, { t: 'Devis ' + (f.devis || ch.numero) + ' accepté – ' + eur(f.totalDevisHT) + ' HT' },
    { t: f.type === 'acompte' ? 'Acompte de ' + fmtQ(f.pct) + ' % à la commande' : 'Situation n° ' + f.situation + (f.solde ? ' (solde)' : '') + ' – travaux réalisés au ' + fmtLong(f.date) },
    { t: 'Catégorie : prestation de services' }]);
  const bh = 12 + Math.max(L1.length, L2.length) * 4.4 + 2;
  [[M, 'CLIENT', L1], [M + bw + 6, 'CHANTIER', L2]].forEach(([x, t, ls]) => {
    doc.setDrawColor(...C.line); doc.setLineWidth(0.3); doc.roundedRect(x, y, bw, bh, 2, 2);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.5); doc.setTextColor(...C.mut); doc.text(t, x + 4, y + 6, { charSpace: 0.4 });
    doc.setFontSize(9.5); doc.setTextColor(...C.ink);
    ls.forEach((l, i) => { doc.setFont('helvetica', l.b ? 'bold' : 'normal'); doc.text(l.t, x + 4, y + 12 + i * 4.4); });
  });
  y += bh + 8;

  const cols = f.type === 'acompte'
    ? [{ h: 'Désignation', w: 148, a: 'left' }, { h: 'Montant HT', w: 30, a: 'right' }]
    : [{ h: 'Désignation', w: 74, a: 'left' }, { h: 'Marché HT', w: 26, a: 'right' }, { h: 'Avancement', w: 22, a: 'right' }, { h: 'Déjà facturé', w: 26, a: 'right' }, { h: 'Cette facture', w: 30, a: 'right' }];
  const head = () => {
    doc.setFillColor(...C.soft); doc.rect(M, y, CW, 7.5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(...C.mut);
    let x = M; cols.forEach(c => { doc.text(c.h, c.a === 'right' ? x + c.w - 2 : x + 2, y + 5, { align: c.a }); x += c.w; }); y += 7.5;
  };
  ensure(20); head();
  const row = (cells) => {
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...C.ink);
    const parts = doc.splitTextToSize(T(cells[0]), cols[0].w - 4);
    const rh = Math.max(7, parts.length * 4 + 3);
    if (y + rh > H - 24) { doc.addPage(); y = M + 4; head(); doc.setFont('helvetica', 'normal'); doc.setFontSize(9); }
    let x = M; const ty = y + 4.8;
    doc.text(parts, x + 2, ty); x += cols[0].w;
    cells.slice(1).forEach((v, i) => { doc.text(T(v), x + cols[i + 1].w - 2, ty, { align: 'right' }); x += cols[i + 1].w; });
    y += rh; doc.setDrawColor(...C.line); doc.setLineWidth(0.2); doc.line(M, y, W - M, y);
  };
  if (f.type === 'acompte') row(['Acompte de ' + fmtQ(f.pct) + ' % sur le devis ' + f.devis + ' (montant total ' + eur(f.totalDevisHT) + ' HT)', eur(f.netHT)]);
  else {

function Thumb({ f }) {
  const isImg = IMG_RE.test(f.type || '');
  const [url, setUrl] = useState(null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (!isImg) return;
    let dead = false, made = null;
    const useBlob = b => { if (dead) return; made = URL.createObjectURL(b); setUrl(made); };
    const cached = fileCache.get(f.id);
    if (cached) useBlob(cached);
    else if (f.src === 'db' || f.src === 'local') blobFor(f).then(useBlob).catch(() => { if (!dead) setFailed(true); });
    else setUrl('/_blob/' + f.id);
    return () => { dead = true; if (made) URL.revokeObjectURL(made); };
  }, [f.id]);
  const onErr = () => {
    if (url && url.indexOf('/_blob/') === 0) blobFor(f).then(b => setUrl(URL.createObjectURL(b))).catch(() => setFailed(true));
    else setFailed(true);
  };
  const ext = (f.type === 'application/pdf' ? 'PDF' : (String(f.nom).split('.').pop() || 'DOC')).toUpperCase().slice(0, 4);
  return html`<div className="th">${isImg && url && !failed ? html`<img src=${url} alt=${f.nom} onError=${onErr} />` : isImg && !failed ? '…' : ext}</div>`;
}

async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  await loadLib('pdfjsWorker');
  const lib = await loadLib('pdfjsLib');
  try { lib.GlobalWorkerOptions.workerSrc = LIBS.pdfjsWorker[0]; } catch (e) { }
  return lib;
}
async function extractPdf(f, wantImages) {
  const lib = await loadPdfJs();
  const b = await blobFor(f);
  const pdf = await lib.getDocument({ data: new Uint8Array(await b.arrayBuffer()), isEvalSupported: false }).promise;
  let text = '';
  const n = Math.min(pdf.numPages, 12);
  for (let i = 1; i <= n && text.length < 25000; i++) {
    const pg = await pdf.getPage(i);
    const tc = await pg.getTextContent();
    text += '\n' + tc.items.map(it => (it.str || '') + (it.hasEOL ? '\n' : ' ')).join('');
  }
  const images = [];
  if (wantImages && text.replace(/\s/g, '').length < 300) {
    for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
      const pg = await pdf.getPage(i);
      const v0 = pg.getViewport({ scale: 1 });
      const v = pg.getViewport({ scale: Math.min(2.5, 1600 / Math.max(v0.width, v0.height)) });
      const c = document.createElement('canvas'); c.width = Math.ceil(v.width); c.height = Math.ceil(v.height);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
      await pg.render({ canvasContext: ctx, viewport: v }).promise;
      const bl = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
      if (bl) images.push(bl);
    }
  }
  try { pdf.destroy(); } catch (e) { }
  return { text: text.trim().slice(0, 25000), images };
}

function localParse(text) {
  const t = String(text || ''), s = {}, c = {};
  const em = t.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/); if (em) c.email = em[0];
  const tel = t.match(/(?:\+33\s?|0)[1-9](?:[\s.-]?\d{2}){4}/); if (tel) c.tel = tel[0];
  if (Object.keys(c).length) s.client = c;
  const tot = t.match(/total[^\n\d]{0,40}(\d[\d ]*(?:[.,]\d+)?)\s*(?:m²|m2|m 2)/i);
  const vals = []; const re = /(\d[\d ]{0,6}(?:[.,]\d+)?)\s*(?:m²|m2|mètres? carrés?)/gi; let m;
  while ((m = re.exec(t))) { const v = num(m[1].replace(/\s/g, '')); if (v > 0 && v < 100000) vals.push(v); }
  if (tot) s.surface = Math.round(num(tot[1].replace(/\s/g, '')));
  else if (vals.length) s.surface = Math.round(vals.length >= 3 ? vals.reduce((a, b) => a + b, 0) : Math.max(...vals));
  if (/pl[âa]tre|ciment|gravats|peinture au sol|chape|laitance/i.test(t)) s.salissure = 'important';
  else if (/l[ée]g[èe]re|finition|peu sale/i.test(t)) s.salissure = 'leger';
  const pr = [];
  if (/vitre|fen[êe]tre|baie|vitrage/i.test(t)) pr.push('vitres');
  if (/trace|peinture|colle|laitance|ciment|pl[âa]tre/i.test(t)) pr.push('traces');
  if (/cuisine|[ée]lectrom[ée]nager/i.test(t)) pr.push('cuisine');
  if (/escalier|parties? communes?|\bhall/i.test(t)) pr.push('communs');
  if (/d[ée]chets|gravats|emballages/i.test(t)) pr.push('dechets');
  if (/hepa|poussi[èe]res? fines?/i.test(t)) pr.push('hepa');
  if (pr.length) s.prestations = pr;
  if (/bureau/i.test(t)) s.type = 'bureaux'; else if (/commerce|boutique|magasin/i.test(t)) s.type = 'commerce';
  else if (/entrep[ôo]t|usine|industri/i.test(t)) s.type = 'industriel'; else if (/[ée]cole|coll[èe]ge|lyc[ée]e|mairie/i.test(t)) s.type = 'ecole';
  else if (/appartement|maison|logement|villa|studio|pavillon/i.test(t)) s.type = 'logement';
  const eq = [];
  const chef = t.match(/(\d+)\s*chefs?\s+d['’]?\s*[ée]quipe/i); if (chef) eq.push({ role: 'chef', nb: +chef[1] });
  const ag = t.match(/(\d+)\s*(?:agents?|personnes?|ouvriers?|employ[ée]s?|techniciens?)\b/i); if (ag) eq.push({ role: 'agent', nb: +ag[1] });
  const vit = t.match(/(\d+)\s*laveurs?\s+de\s+vitres/i); if (vit) eq.push({ role: 'vitres', nb: +vit[1] });
  const eqOk = eq.filter(x => x.nb > 0 && x.nb < 50); if (eqOk.length) s.equipe = eqOk;
  const d = t.match(/(?:d[ée]but|d[ée]marrage|intervention|[àa] partir du|pr[ée]vu le)\D{0,25}(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})/i);
  if (d) s.dateDebut = d[3] + '-' + pad(d[2]) + '-' + pad(d[1]);
  // Plusieurs bâtiments « Nom : 1 835 m² » ou lignes de tableau « Nom ; 1835 »
  const zs = []; const zre = /^[ \t ]*[-•*–]?[ \t ]*([^\n:;|]{2,60}?)[ \t ]*[:;|][ \t ]*(\d[\d  ]*(?:[.,]\d+)?)[ \t ]*(?:m²|m2)?[ \t ]*(?:[;|].*)?$/gim;
  while ((m = zre.exec(t))) {
    const nom = m[1].trim(), v = num(m[2].replace(/[\s ]/g, ''));
    if (v >= 5 && v < 1e6 && !/total|^\d|t[ée]l|siret|tva|prix|montant|date/i.test(nom)) zs.push({ nom, surface: v });
  }
  if (zs.length >= 2) {
    const phases = [];
    const t2 = t.replace(/pr[ée][\s-]*opr/gi, ' ');
    if (/pr[ée][\s-]*opr/i.test(t)) phases.push({ nom: 'Nettoyage pré-OPR', sal: 'important' });
    if (/\bopr\b/i.test(t2)) phases.push({ nom: 'Nettoyage OPR', sal: 'normal' });
    if (/r[ée]ception|livraison/i.test(t)) phases.push({ nom: 'Nettoyage de réception', sal: 'leger' });
    s.zones = phases.length >= 2 ? phases.flatMap(ph => zs.map(z => ({ nom: ph.nom + ' – ' + z.nom, surface: z.surface, salissure: ph.sal, date: '', periode: '' })))
      : zs.map(z => ({ nom: z.nom, surface: z.surface, salissure: '', date: '', periode: '' }));
    delete s.surface;
  }
  if (/sous[- ]?trait/i.test(t)) s.typeClient = 'btp';
  else if (/\bmairie\b|commune de|conseil (?:d[ée]partemental|r[ée]gional)|march[ée] public/i.test(t)) s.typeClient = 'public';
  if (/agent[^.\n]{0,40}(?:à|a) la journ[ée]e/i.test(t)) s.lignes = [{ label: 'Mise à disposition d’un agent de nettoyage à la journée', qte: 1, unite: 'jour', role: 'agent' }];
  if (/nacelle|moyens? de levage/i.test(t)) (s.lignes = s.lignes || []).push({ label: 'Moyens de levage (nacelle) pour les vitres en hauteur', qte: 1, unite: 'jour', role: '' });
  return s;
}

function normalizeResult(r) {
  r = r && typeof r === 'object' ? r : {};

  const s = {};
  const rc = r.client && typeof r.client === 'object' ? r.client : {};
  const client = { nom: str(rc.nom), adresse: str(rc.adresse), tel: str(rc.tel, 40), email: str(rc.email, 120) };
  Object.keys(client).forEach(k => { if (!client[k]) delete client[k]; });
  if (Object.keys(client).length) s.client = client;
  if (str(r.titre)) s.titre = str(r.titre, 120);
  if (str(r.adresse_chantier)) s.adresse = str(r.adresse_chantier);
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(r.date_debut || ''))) s.dateDebut = r.date_debut;
  const sm = num(r.surface_m2); if (sm > 0 && sm < 100000) s.surface = Math.round(sm);
  if (TYPES.some(t => t.id === r.type)) s.type = r.type;
  if (TYPES_CLIENT.some(t => t.id === r.type_client)) s.typeClient = r.type_client;
  if (SALISSURES.some(t => t.id === r.salissure)) s.salissure = r.salissure;
  if (Array.isArray(r.prestations)) { const p = r.prestations.filter(id => PRESTA_BY_ID[id] && !PRESTA_BY_ID[id].base); if (p.length) s.prestations = p; }
  if (Array.isArray(r.equipe)) {
    const acc = {};
    r.equipe.forEach(x => { const role = x && x.role, nb = Math.round(num(x && x.nb)); if (ROLE_BY_ID[role] && nb > 0 && nb < 50) acc[role] = (acc[role] || 0) + nb; });
    const eq = ROLES.filter(ro => acc[ro.id]).map(ro => ({ role: ro.id, nb: acc[ro.id] }));
    if (eq.length) s.equipe = eq;
  }
  const h = num(r.heures); if (h > 0 && h < 50000) s.heures = Math.round(h * 2) / 2;
  const dj = Math.round(num(r.delai_jours)); if (dj > 0 && dj < 400) s.delai = dj;
  if (Array.isArray(r.zones)) {
    const zs = r.zones.filter(z => z && typeof z === 'object').map(z => ({
      nom: str(z.nom, 140) || 'Zone', surface: num(z.surface_m2 != null ? z.surface_m2 : z.surface),
      salissure: SALISSURES.some(x => x.id === z.salissure) ? z.salissure : '',
      date: /^\d{4}-\d{2}-\d{2}$/.test(String(z.date || '')) ? z.date : '', periode: str(z.periode, 80),
      delai: Math.round(num(z.delai_jours)) > 0 && Math.round(num(z.delai_jours)) < 400 ? String(Math.round(num(z.delai_jours))) : ''
    })).filter(z => z.surface > 0 && z.surface < 1e6).slice(0, 80);
    if (zs.length) { s.zones = zs; delete s.surface; }
  }
  if (Array.isArray(r.lignes)) {
    const ls = r.lignes.filter(l => l && typeof l === 'object' && str(l.label)).map(l => ({
      label: str(l.label, 150), qte: num(l.qte) > 0 ? num(l.qte) : 1,
      unite: ['jour', 'h', 'forfait', 'm²', 'pce'].includes(l.unite) ? l.unite : 'forfait', role: ROLE_BY_ID[l.role] ? l.role : ''
    })).slice(0, 15);
    if (ls.length) s.lignes = ls;
  }
  if (!s.dateDebut && s.zones) { const ds = s.zones.map(z => z.date).filter(Boolean).sort(); if (ds.length) s.dateDebut = ds[0]; }
  if (str(r.observations, 600)) s.observations = str(r.observations, 600);
  return s;
}

    const known = new Set((cur.extras || []).map(x => String(x.label || '').toLowerCase()));

  if (s.type) p.type = s.type;
  if (s.salissure) p.salissure = s.salissure;
  if (s.prestations && s.prestations.length) { const set = new Set([...(cur.prestations || []), ...s.prestations]); p.prestations = PRESTATIONS.map(x => x.id).filter(id => set.has(id)); }
  if (s.equipe && s.equipe.length) { p.besoins = s.equipe; p.modeEquipe = 'manuel'; }
  if (s.delai) p.delai = String(s.delai);
  if (s.heures) p.heuresManuel = String(s.heures);
  if (s.observations && !String(cur.notes || '').includes(s.observations)) p.notes = (cur.notes && cur.notes.trim() ? cur.notes.trim() + '\n\n' : '') + s.observations;
  return p;
}
function summaryOf(s) {
  const out = [];
  if (s.client && s.client.nom) out.push('client ' + s.client.nom);
  else if (s.client) out.push('coordonnées du client');
  if (s.typeClient) out.push('client ' + labelOf(TYPES_CLIENT, s.typeClient).toLowerCase() + ' (TVA choisie avec)');
  if (s.adresse) out.push('adresse');
  if (s.zones) out.push(s.zones.length + ' zone' + (s.zones.length > 1 ? 's' : '') + ' (' + fmtNum(s.zones.reduce((a, z) => a + z.surface, 0), 0) + ' m² à nettoyer au total)');
  if (s.surface) out.push(fmtNum(s.surface, 0) + ' m²');
  if (s.lignes) out.push(s.lignes.length + ' ligne' + (s.lignes.length > 1 ? 's' : '') + ' en plus (' + s.lignes.map(l => l.label).join(', ') + ')');
  if (s.type) out.push(labelOf(TYPES, s.type).toLowerCase());
  if (s.salissure) out.push('salissure ' + labelOf(SALISSURES, s.salissure).toLowerCase());
  if (s.prestations && s.prestations.length) out.push(s.prestations.length + ' prestation' + (s.prestations.length > 1 ? 's' : '') + ' en plus');
  if (s.equipe) out.push('équipe : ' + s.equipe.map(b => b.nb + ' ' + (b.nb > 1 ? ROLE_BY_ID[b.role].plural : ROLE_BY_ID[b.role].label.toLowerCase())).join(' + '));
  if (s.heures) out.push(fmtH(s.heures));
  if (s.delai) out.push('délai ' + s.delai + ' jours');
  if (s.dateDebut) out.push('début ' + fmtDay(s.dateDebut));
  return out;
}

function AskClaude({ ch, comp }) {
  const [q, setQ] = useState('');
  const [a, setA] = useState('');
  const [st, setSt] = useState('idle');
  const [off, setOff] = useState(false);
  const ctl = useRef(null);
  if (off) return null;
  const ask = async (question) => {
    const qq = String(question ?? q).trim();
    if (!qq || !svc.sample) return;
    ctl.current = new AbortController(); setSt('run'); setA('');
    const resume = 'Devis ' + ch.numero + ' – client : ' + ((ch.client && ch.client.nom) || 'non renseigné') + ' (' + (labelOf(TYPES_CLIENT, ch.typeClient) || 'type non choisi') + ') ; chantier : ' + (ch.titre || 'sans titre') +
      ' ; ' + fmtNum(comp.surface, 0) + ' m² ; ' + fmtH(comp.hours) + ' de travail ; équipe : ' + comp.crewLabel + ' ; taux horaire moyen ' + eur(comp.rate) + ' ; total HT ' + eur(comp.ht) + ' ; ' + comp.rule.label + ' ; ' + comp.ttcLabel + ' ' + eur(comp.ttc) +
      '. Lignes : ' + comp.lines.slice(0, 25).map(l => l.label + ' = ' + eur(l.total)).join(' ; ') + '.';
    const prompt = 'Tu aides un entrepreneur débutant, en France, qui prépare un devis de nettoyage de fin de chantier et ne connaît pas les règles des devis. ' +
      'Réponds en français simple, en 3 à 6 phrases courtes, sans jargon (explique chaque terme technique), sans mise en forme Markdown. ' +
      'Pour une question de droit, de fiscalité ou d’assurance, donne la règle générale et conseille de faire vérifier par un comptable. Ne donne pas de prix de marché inventés. ' +
      'Si la question porte sur son devis, appuie-toi sur ces informations :\n' + resume + '\n\nQuestion : ' + qq;
    try {
      await svc.sample(prompt, { signal: ctl.current.signal, cache: false, onText: ({ text }) => setA(text.replace(/\*\*/g, '')) });
      setSt('done');
    } catch (e) {
      const c = e && e.code;
      if (c === 'cancelled') { setSt('idle'); return; }
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { setOff(true); return; }
      setA(e && e.text ? e.text : ''); setSt(c === 'rate_limited' ? 'limit' : 'err');
    }
  };
  const SUGG = ['Comment trouver mes cadences ?', 'Pourquoi cette TVA ?', 'Que mettre dans les conditions de paiement ?'];
  return html`<div className="ask">
    <label className="lbl" htmlFor="ask-q">Pose ta question sur ce devis</label>
    <div className="chips">${SUGG.map(s => html`<button type="button" key=${s} className="chip" disabled=${st === 'run'} onClick=${() => { setQ(s); ask(s); }}>${s}</button>`)}</div>
    <div className="addrow">
      <input id="ask-q" className="inp" style=${{ flex: '1', minWidth: '180px' }} value=${q} placeholder="Ex. Comment présenter l’agent à la journée ?" onChange=${e => setQ(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter') ask(); }} />
      ${st === 'run' ? html`<button type="button" className="btn ghost" onClick=${() => ctl.current && ctl.current.abort()}>Arrêter</button>`
        : html`<button type="button" className="btn" onClick=${() => ask()} disabled=${!q.trim()}>Demander</button>`}
    </div>
    ${st === 'run' && !a ? html`<p className="small muted">Claude réfléchit…</p>` : null}
    ${a ? html`<div className="answer">${a}</div>` : null}
    ${st === 'err' ? html`<p className="warn-box">La réponse n’a pas pu arriver. Réessaie.</p>` : st === 'limit' ? html`<p className="warn-box">Trop de questions d’un coup. Réessaie dans quelques minutes.</p>` : null}
  </div>`;
}
